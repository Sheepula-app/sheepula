function genTut(x0,c){

  if(c===1){addEnt({type:'tip',wx:x0+40,step:'sheep'});for(let k=0;k<4;k++)addDrop(x0+260+k*44,lerp(my,G-120,k/3));const s=addSheep(x0+520);s.tut=1;return 900;}

}

      ctx.fillStyle='rgba(120,80,30,0.45)';ctx.beginPath();ctx.arc(x+tx,by+th*0.55,3.4,Math.PI,0);ctx.fill();}
    ctx.strokeStyle=C.ink;ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(x,top-42);ctx.lineTo(x,top-64);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x,top-64);ctx.lineTo(x+14,top-59);ctx.lineTo(x,top-54);ctx.closePath();inkIt(C.blood,1.2);
  }else{
    for(const [bx,by,r] of [[-40,8,9],[-18,2,7],[30,6,10],[48,14,7],[8,0,6]]){ctx.beginPath();ctx.ellipse(x+bx,top+by,r,r*0.7,0,0,7);inkIt('#ecd08e',1.8);}

function resize(){
  const r=cv.getBoundingClientRect();
  const cw=Math.max(1,r.width),ch=Math.max(1,r.height);
  DPR=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(cw*DPR);cv.height=Math.round(ch*DPR);
  const VH=cw/ch>=1.25?540:640;
  S=Math.min(ch/VH,cw/360);
  W=cw/S;H=ch/S;G=H-66;PX=clamp(W*0.26,92,250);uiK=Math.min(1,H/640);

}
function buildStatic(){
  vignette=ctx.createRadialGradient(W/2,H*0.45,Math.min(W,H)*0.32,W/2,H*0.5,Math.max(W,H)*0.82);
  vignette.addColorStop(0,'rgba(8,2,18,0)');vignette.addColorStop(1,'rgba(8,2,18,0.6)');
  stars=[];const n=Math.round(W*H/5000);
  for(let i=0;i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*G*0.7,r:rand(0.6,1.8),p:Math.random()*6.28,s:rand(1,3)});
  if(!grainPat){
    const g=document.createElement('canvas');g.width=g.height=128;const gx=g.getContext('2d');
    const id=gx.createImageData(128,128);
    for(let i=0;i<id.data.length;i+=4){const v=Math.random()*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=Math.random()<0.55?0:34;}

let AC=null,master=null,sfxBus=null,musBus=null,noiseBuf=null,musicTimer=null,nextNote=0,musicStep=0;
function unlockAudio(){
  if(AC){if(AC.state==='suspended')AC.resume().catch(()=>{});return;}
  const Ctor=window.AudioContext||window.webkitAudioContext;if(!Ctor)return;
  try{
    AC=new Ctor();
    master=AC.createGain();master.gain.value=save.muted?0:1;master.connect(AC.destination);
    sfxBus=AC.createGain();sfxBus.gain.value=0.55;sfxBus.connect(master);
    musBus=AC.createGain();musBus.gain.value=0.22;musBus.connect(master);
    noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
    const ch=noiseBuf.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;
    startMusic();
  }catch(e){AC=null;}
}
function env(g,t,vol,a,dur){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(vol,0.0002),t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);}
function tone(f,dur,{type='sine',f2=0,vol=0.2,when=0,a=0.005,bus=null,lp=0}={}){
  if(!AC)return;const t=AC.currentTime+when;const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  env(g,t,vol,a,dur);let node=o;
  if(lp){const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=lp;o.connect(fl);node=fl;}
  node.connect(g);g.connect(bus||sfxBus);o.start(t);o.stop(t+dur+0.05);
}
function noise(dur,{vol=0.2,f=1000,f2=0,q=1,type='bandpass',when=0,a=0.005}={}){
  if(!AC)return;const t=AC.currentTime+when;const s=AC.createBufferSource();s.buffer=noiseBuf;
  const fl=AC.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+dur);fl.Q.value=q;
  const g=AC.createGain();env(g,t,vol,a,dur);s.connect(fl);fl.connect(g);g.connect(sfxBus);s.start(t,Math.random()*0.4);s.stop(t+dur+0.05);
}

let curTrack='menu';
function bossActive(){return ents.some(e=>(e.type==='boss'||e.type==='fboss')&&e.state!=='wait'&&e.state!=='defeated'&&e.state!=='giveup');}
function wantedTrack(){
  if(state==='menu'||state==='castle'||state==='over')return 'menu';
  if(bossActive())return 'boss';
  return theme.track||WORLD_TRACK[worldIndexAt(cam)%4];
}
function pluck(f,t,dur,type,vol){
  const o=AC.createOscillator(),g=AC.createGain(),fl=AC.createBiquadFilter();
  o.type=type;o.frequency.value=f;fl.type='lowpass';fl.frequency.value=type==='square'||type==='sawtooth'?1800:type==='sine'?3000:900;
  env(g,t,vol,0.006,dur);o.connect(fl);fl.connect(g);g.connect(musBus);o.start(t);o.stop(t+dur+0.05);
}
function hat(t,vol){const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=7000;const g=AC.createGain();env(g,t,vol,0.002,0.05);s.connect(f);f.connect(g);g.connect(musBus);s.start(t,Math.random()*0.5);s.stop(t+0.08);}
function startMusic(){
  if(musicTimer||!AC)return;nextNote=AC.currentTime+0.15;
  musicTimer=setInterval(()=>{
    if(!AC)return;
    if(nextNote<AC.currentTime-0.2)nextNote=AC.currentTime+0.05;
    while(nextNote<AC.currentTime+0.15){
      if(musicStep%8===0){const w=wantedTrack();if(w!==curTrack){curTrack=w;musicStep=0;}}
      const T=TRACKS[curTrack],vamp=P.pw.vampire>0&&state==='playing',step=60/(T.bpm*(vamp?1.22:1))/2;
      if(state!=='paused'){
        const i=musicStep%16,bar=Math.floor(musicStep/16)%4;
        if(T.bass[i])pluck(nf(T.bass[i]),nextNote,step*0.95,T.bt,T.bv);
        const mel=T.mel[bar];
        if(mel&&mel[i])pluck(nf(mel[i]),nextNote,step*T.md,T.mt,T.mv);
        if((T.hats||vamp)&&i%2===0)hat(nextNote,i%4===0?0.12:0.06);
        if(vamp&&i%4===2){const b=T.bass[i-2]||T.bass[0]||'D2';pluck(nf(b)*4,nextNote,step*0.6,'square',0.035);}
      }
      nextNote+=step;musicStep++;
    }
  },30);
}

function genSection(){
  if(run&&run.tut&&gen.count<5){const len=genTut(gen.x,gen.count);gen.x+=len;gen.count++;gen.last='free';return;}
  const x0=gen.x,d=difficulty(x0),c=gen.count;
  let type,len;
  if(c>3&&x0>=gen.nextBoss){
    const farmerBoss=gen.bossN%2===1;gen.bossN++;
    if(farmerBoss)addEnt({type:'fboss',wx:x0+200,sx:W+220,state:'wait',t:0,hp:3,ph:0,time:0,startX:x0,attack:-1,dropT:2,n:0,stalls:0,lift:0,wheel:0});
    else addEnt({type:'boss',wx:x0+200,sx:W+120,y:PT()+110,state:'wait',t:0,hp:3,ph:0,time:0,startX:x0,attack:-1,dropT:2,lane:0,eggs:0,tired:0});
    gen.paused=true;gen.last='boss';return;
  }
  if(c===0)type='intro';
  else if(c===1)type='obstacles';
  else if(c===2)type='free';
  else if(c===3)type='enemies';
  else{
    const wf=lerp(.58,.45,d),wo=lerp(.27,.33,d),r=Math.random();
    type=r<wf?'free':r<wf+wo?'obstacles':'enemies';
    if(type!=='free'&&gen.last!=='free'&&Math.random()<0.5)type='free';
  }
  if(type==='intro')len=genFree(x0,900,true);
  else if(type==='free')len=genFree(x0,randi(700,1050),false);
  else if(type==='obstacles')len=genObstacles(x0,d,c===1?2:randi(3,4),c===1);
  else len=genEnemies(x0,d,c===3);
  stats[type]+=len;gen.x+=len;gen.count++;gen.last=type;
}
function genFree(x0,len,intro){
  let x=x0+(intro?140:110);const end=x0+len-80;
  const pats=intro?1:randi(1,2);
  for(let p=0;p<pats&&x<end;p++){
    const n=randi(5,8),y=rand(PT()+70,PB()-90),kind=pick(['wave','arc','line','diag','zig']),dir=Math.random()<.5?1:-1;
    for(let i=0;i<n&&x+i*42<end;i++){
      let yy=y;
      if(kind==='wave')yy=y+Math.sin(i*0.9)*40;
      else if(kind==='arc')yy=y-Math.sin(i/(n-1)*Math.PI)*70+35;
      else if(kind==='diag')yy=y+(i-(n-1)/2)*18*dir;
      else if(kind==='zig')yy=y+(i%2?-14:14);
      addDrop(x+i*42,clamp(yy,PT()+10,PB()-10));
    }
    x+=n*42+rand(90,170);
  }
  if(intro||Math.random()<CONFIG.sheepChance){
    const sx=x0+len*(intro?0.78:rand(.45,.85));
    if(!intro&&x0>3000&&Math.random()<CONFIG.baitChance)addBait(sx);else addSheep(sx);
    if(intro)for(let k=0;k<4;k++)addDrop(sx-200+k*46,lerp(PB()-210,G-150,k/3));
  }
  if(!intro){
    const force=gen.count===2||gen.sinceP>=2;
    if(force||Math.random()<powerChance()){addPower(x0+len*rand(.3,.7),rand(PT()+50,PB()-150),gen.count===2?'shield':undefined);gen.sinceP=0;}
    else gen.sinceP++;
    const firstChest=save.stats.chestsFound===0&&run.chests===0&&!gen.chestGiven&&gen.count>=5;
    if(mode!=='story'&&gen.count>=4&&(firstChest||Math.random()<CONFIG.chestChance)){addEnt({type:'chest',wx:x0+len*rand(.35,.75),y:rand(PT()+60,PB()-130),ph:0});gen.chestGiven=true;}
  }
  return len;
}
function makeStake(wx,gy,gap,kind){
  const top=gy-gap/2,bot=gy+gap/2,w=kind==='tower'?54:44,cx=w/2,rects=[];
  if(kind==='pair')rects.push([5,w-5,-400,top-16],[cx-9,cx+9,-400,top-3]);
  if(kind==='branch')rects.push([cx-11,cx+11,-400,top-6]);
  if(kind==='pair')rects.push([5,w-5,bot+16,G+80],[cx-9,cx+9,bot+3,G+80]);
  if(kind==='tower')rects.push([4,w-4,bot+40,G+80],[cx-12,cx+12,bot+14,G+80]);
  addEnt({type:'stake',kind,wx,w,gy,gap,top,bot,rects,seed:Math.random()*100,passed:false,hitFx:false});
}
function genObstacles(x0,d,n,tutorial){
  const gap=lerp(CONFIG.gapStart,CONFIG.gapMin,d)+(tutorial?30:0);
  const spacing=lerp(300,250,d);
  const lo=50+gap/2,hi=G-36-gap/2;
  let gy=gen.gapY==null?(lo+hi)/2:clamp(gen.gapY,lo,hi);
  for(let i=0;i<n;i++){
    const shift=tutorial?70:lerp(110,185,d);
    gy=clamp(gy+rand(-shift,shift),lo,hi);
    const r=Math.random();
    const kind=d>0.12&&r<0.16?'tower':d>0.12&&r<0.30?'branch':'pair';
    const wx=x0+170+i*spacing;
    makeStake(wx,gy,gap,kind);
    addDrop(wx+(kind==='tower'?27:22),gy);
  }
  gen.gapY=gy;
  return 170+n*spacing+30;
}
function spawnEnemy(t,wx,d){
  const chick=(x,hk,late)=>addEnt({type:'chicken',wx:x,y:G-2,vy:0,vx:0,state:'idle',t:0,h:hk*(G-PT()),ph:Math.random()*6,late:late||0});
  if(t==='chicken'){chick(wx,rand(.32,.58));if(d>0.45&&Math.random()<.4)chick(wx+80,rand(.15,.3),0.45);}
  else if(t==='farmer'){const fast=d>0.12&&Math.random()<0.22+0.28*d;addEnt({type:'farmer',wx,state:'idle',t:0,throws:fast?1:d>0.55?2:1,ph:0,fast,aimY:0,locked:false});if(d>0.4&&Math.random()<0.35)chick(wx-140,rand(.3,.5));}
  else if(t==='hen')addEnt({type:'hen',wx,y:rand(PT()+56,PT()+96),state:'wait',t:0,drop:0.45,eggs:randi(3,4)+(d>0.6?1:0),ph:0});
  else if(t==='rooster')addEnt({type:'rooster',wx,y:0,state:'pending',t:0,ph:0});
  else if(t==='hunter')addEnt({type:'hunter',wx,state:'idle',t:0,volleys:d>0.6?2:1,aimY:0,locked:false,ph:0});
  else if(t==='trap')addEnt({type:'trap',wx:wx-60,w:120,state:'idle',t:0,k:0,bst:'idle',bwx:wx+100,ph:0,top:G-CONFIG.springCover*(G-PT())});
}
function addBait(sx){
  const sh=addEnt({type:'sheep',wx:sx,y:G,ph:Math.random()*6,state:'graze',t:0,alert:false,bait:true});
  addEnt({type:'bait',wx:sx+64,nx:sx,sheep:sh,state:'hide',t:0,k:0,ph:0});
}
function genEnemies(x0,d,intro){
  const pool=['chicken','farmer'];
  if(x0>1800)pool.push('hen');
  if(x0>3000)pool.push('rooster');
  if(x0>CONFIG.trapFrom)pool.push('trap');
  if(x0>CONFIG.hunterFrom)pool.push('hunter');
  const n=intro?2:randi(2,d>0.5?3:2)+(d>0.8&&Math.random()<0.3?1:0);
  const spacing=lerp(470,380,d);
  let last='';
  for(let i=0;i<n;i++){
    const t=intro?(i===0?'chicken':'farmer'):pick(pool.filter(p=>p!==last));
    last=t;const wx=x0+200+i*spacing;
    spawnEnemy(t,wx,intro?0:d);
    if(i<n-1){
      if(Math.random()<0.7){const yy=rand(PT()+60,PB()-130);for(let k=0;k<3;k++)addDrop(wx+spacing*0.5-42+k*42,yy);}
      else if(Math.random()<0.5){addPower(wx+spacing*0.5,rand(PT()+60,PB()-140));gen.sinceP=0;}
    }
  }
  return 200+n*spacing+60;
}
function spawnDecor(){
  const off=cam*0.35;
  while(midNext<off+W+160){
    const w=TW()[worldIndexAt(cam+W)%TW().length];
    decorMid.push({x:midNext,type:pick(w.decor),seed:Math.random()*100,s:rand(.8,1.15)});
    midNext+=rand(130,300);
  }
  while(nearNext<cam+W+120){
    const w=TW()[worldIndexAt(nearNext)%TW().length];
    decorNear.push({x:nearNext,type:pick(w.near),seed:Math.random()*100,s:rand(.85,1.1)});
    nearNext+=rand(70,210);
  }
}

/* ================= Actions ================= */
function startRun(){
  unlockAudio();
  state='ready';stateT=0;run.skin=activeSkin();run.tut=mode==='endless'&&!save.tutDone&&!trialSkin;
  P.vy=0;P.expr='happy';P.exprT=0;
  run.revives=up('throne')>=1?1:0;
  if(up('throne')>=2)P.screamN=Math.floor(screamCost()/2);
  if(up('library')>=3)P.pw.shield=4;
  const se=season();
  for(const sk of SKINS)if(sk.how==='season'&&sk.season===se&&unlockSkin(sk.id)){run.unlocked.push(sk.name);if(save.runs>=3)toast(sk.name+' Sheepula unlocked! (event)');}
  if(theme.id!=='night'&&!save.stats['tip_'+theme.id]){tipOnce('tip_'+theme.id,'Welcome to '+TW()[0].name+'! Grab the '+theme.item.many+'!');}
  else if(trialSkin){const sk=SKINS.find(x=>x.id===trialSkin);toast('Trying '+(sk?sk.name:'')+' Sheepula for one run');}
  missionsStart();
}
function restart(){if(mode==='story'&&curLevel){startLevel(curLevel);return;}resetWorld();state='menu';startRun();}
function tryRun(id){trialSkin=id;restart();}
function toast(m){if(run){run.toastMsg=m;run.toastT=3;}}
function goMenu(){mode='endless';curLevel=null;trialSkin=null;resetWorld();state='menu';stateT=0;sfx.click();}
function pause(){if(state==='playing'){state='paused';stateT=0;}}
function resume(){if(state==='paused'){state='resuming';resumeT=1.2;sfx.click();}}
function flap(){
  if(P.dead)return;
  P.vy=CONFIG.flapVel;P.flapK=1;sfx.flap();
  puff(cam+PX-14,P.y+20,1);
}
function addScream(n){
  const cost=screamCost(),was=P.screamN>=cost;
  P.screamN=Math.min(cost,P.screamN+n);
  if(!was&&P.screamN>=cost){sfx.ready();if(!run.screamHint&&!run.tut){run.screamHint=true;run.screamHintT=3.2;}}
}
function collectDrop(e){
  run.blood++;
  run.combo=(time-run.lastDrop<0.6)?run.combo+1:0;run.lastDrop=time;
  run.lastEat=cam;mEv('berry');mEv('combo',run.combo+1,1);
  sfx.drop(run.combo);burst(e.wx,e.y,6,theme.item.color,120);
  if(run.combo===6)popText(cam+Math.max(PX+40,W*0.5),Math.max(P.y-70,PT()+50),pickL('combo'),C.gold,22);
  addScream(1);
  if(P.exprT<=0||P.expr==='normal'){P.expr='happy';P.exprT=0.25;}
}
function applyPower(kind,wx,y){
  P.pw[kind]=pwDur(kind);sfx.power();mEv('power');mEv('power_'+kind);ring(wx,y,kind==='shield'?C.shield:C.blood,18,.5);
  popText(kind==='vampire'?cam+Math.max(PX+10,W/2):cam+PX+10,kind==='vampire'?Math.max(P.y-60,PT()+40):P.y-36,{magnet:theme.item.magnet,boost:'BAT BOOST!',shield:'NIGHT SHIELD!',vampire:'VAMPIRE MODE!'}[kind],kind==='shield'?C.shield:C.blood,kind==='vampire'?30:24);
  if(kind==='boost'){P.expr='angry';P.exprT=pwDur('boost');}
  if(kind==='vampire'){P.expr='angry';P.exprT=pwDur('vampire');sfx.vamp();flash=0.4;flashCol=C.blood;shake=Math.max(shake,6);tipOnce('vampSeen','Vampire Mode! Bite straight through enemies for '+theme.item.short+'.');}
}
function stealSheep(e){
  e.state='taken';e.t=0;e.wx0=e.wx;e.y0=e.y;
  run.sheep++;addScream(3);mEv('sheep');
  const bonus=2*up('pen');if(bonus){run.blood+=bonus;popText(e.wx+26,G-98,'+'+bonus+' '+theme.item.short,theme.item.color,18);}
  sfx.baa();popText(e.wx,G-50,pickL('stolen'),C.wool,24);popText(e.wx+20,G-74,'+25',C.warn,20);
  P.expr='happy';P.exprT=0.6;puff(e.wx,G-14,6);
}
function scare(e){
  if(e.state==='flee')return;
  e.state='flee';e.t=0;e.vy=-320;
  if(e.type==='farmer'||e.type==='hunter')popText(e.wx,G-130,pickL('eek'),C.wool,22);
  else feathers(e.wx,(e.type==='chicken'?e.y-14:e.y),7,e.type==='hen'?'#c99462':'#fffaf0');
}
function bonk(e){
  scare(e);run.bonks++;sfx.bonk();shake=Math.max(shake,5);mEv('bonk');
  popText(cam+PX+16,P.y-30,'BONK!',C.warn,24);
}
function doScream(){
  if(state!=='playing'||P.dead)return;
  const cost=screamCost();
  if(P.screamN<cost){run.screamNudge=0.4;run.screamMsg=(cost-P.screamN)+' more '+theme.item.short+' to charge';run.screamMsgT=1.6;sfx.click();return;}
  P.screamN=0;P.expr='angry';P.exprT=0.9;shake=11;sfx.scream();P.grace=Math.max(P.grace,0.5);save.stats.screams++;run.tutScreamed=true;mEv('scream');
  ring(cam+PX,P.y,C.blood,20,.7);ring(cam+PX,P.y,'#ffffff',10,.5);
  popText(cam+PX+20,P.y-44,'MWAHAHA!',C.blood,30);
  let n=0;
  for(const e of ents){
    const sx=e.wx-cam;if(sx<-80||sx>W+340)continue;
    if(e.type==='fboss'){if(['enter','forks','bales','rev','charge','back','stall'].includes(e.state)){fbossHit(e,true);n++;}continue;}
    if(e.type==='bale'){e.dead=true;burst(e.wx,e.y,8,'#e8d08a',140);continue;}
    if(e.type==='hunter'&&e.state!=='flee'){e.state='flee';popText(e.wx,G-140,pickL('eek'),C.wool,22);n++;continue;}
    if(e.type==='garlic'){e.dead=true;burst(e.wx,e.y,8,'#fff',140);continue;}
    if(e.type==='trap'){if(e.bst!=='flee'){e.bst='flee';n++;popText(e.bwx,G-140,pickL('eek'),C.wool,22);}
      if(e.state==='idle'||e.state==='warn')e.state='off';else if(e.state==='deploy'||e.state==='set'){e.state='torn';sfx.rip();}continue;}
    if(e.type==='bait'){if(e.state==='hide'||e.state==='peek'){e.state='flee';n++;}else if(e.state==='throw'||e.state==='net'){e.state='fall';e.t=0.2;}continue;}
    if(e.type==='boss'){if(['enter','swoopWarn','swoop','eggs','chicks','leave','tired'].includes(e.state)){bossHit(e,true);n++;}continue;}
    if(e.type==='rooster'&&(e.state==='pending'||e.state==='warn')){if(e.state==='warn')n++;e.dead=true;continue;}
    if((e.type==='chicken'||e.type==='rooster'||e.type==='hen'||e.type==='farmer')&&e.state!=='flee'){scare(e);n++;}
    else if(e.type==='fork'||e.type==='egg'){e.dead=true;burst(e.wx,e.y,8,'#fff',140);}
  }
  if(n){run.bonks+=n;popText(cam+PX+20,P.y-74,'+'+n*10,C.warn,22);mEv('bonk',n);mEv('scream_hit',n,1);}
}
function die(cause,killer){
  if(godMode)return;
  run.killer=killer||cause;
  mEv('ouch_'+(cause||'other'));
  if(run.revives>0){
    run.revives--;P.pw.shield=2.5;P.vy=-480;if(P.y>G-60)P.y=G-60;
    shake=10;flash=0.35;flashCol=C.gold;sfx.power();puff(cam+PX,P.y,6);
    popText(cam+PX,P.y-40,'SECOND BITE!',C.gold,28);return;
  }
  P.dead=true;state='dying';stateT=0;
  P.vy=-360;P.spin=(Math.random()<.5?-1:1)*9;P.expr='dizzy';P.exprT=99;
  shake=16;flash=0.5;flashCol='#ff2a4a';
  sfx.hit();puff(cam+PX,P.y,9);
  popText(cam+PX,P.y-34,pickL('ouch'),C.warn,30);
}
function gameOver(){
  if(mode==='story'&&curLevel){storyFinish(false);return;}
  if(run.tut){save.tutTries=(save.tutTries||0)+1;if(save.tutTries>=3)save.tutDone=1;}
  mEv('run');
  state='over';stateT=0;
  run.finalScore=score();
  if(mode==='endless')save.stats.lastMeters=cam/10;
  run.newBest=run.finalScore>save.best&&run.finalScore>0;
  if(run.newBest)save.best=run.finalScore;
  save.blood+=run.blood;save.sheep+=run.sheep;save.runs++;
  save.stats.meters+=cam/10;save.stats.bestBlood=Math.max(save.stats.bestBlood,run.blood);save.stats.bestMeters=Math.max(save.stats.bestMeters,cam/10);
  run.trialName=trialSkin?(SKINS.find(x=>x.id===trialSkin)||{}).name:null;trialSkin=null;
  save.chests+=run.chests;save.stats.chestsFound+=run.chests;
  persist();
  run.unlocked.push(...checkUnlocks());
  missionsEnd();
  run.quip=pickL('quips');run.speaker=TL('speaker');
  run.newBest?sfx.best():sfx.over();
}

function throwFork(f,fast){
  const hx=f.wx-16,hy=G-118;
  const ty=fast?f.aimY:clamp(P.y,PT(),PB());
  const close=fast?CONFIG.fastFork:230,dist=(hx-cam)-PX,tt=Math.max(fast?0.18:0.45,dist/close);
  const vxw=speed-close,vy=(ty-hy)/tt;
  addEnt({type:'fork',wx:hx,y:hy,vxw,vy,rot:Math.atan2(vy,-close),fast:!!fast});
  if(fast){sfx.whoosh();popText(f.wx,G-140,pickL('fast'),C.blood,24);shake=Math.max(shake,4);}else sfx.throw();
}
function tipOnce(key,msg){if(!save.stats[key]){save.stats[key]=1;persist();toast(msg);}}
function hunterMuzzle(e){return [e.wx-cam-38,G-92];}
function fireGarlic(e){
  const [mx,my]=hunterMuzzle(e),v=CONFIG.garlicSpeed,dist=Math.max(120,mx-PX);
  for(const o of [-1,0,1]){
    const ty=e.aimY+o*CONFIG.garlicGap,dx=PX-mx,dy=ty-my,L=Math.hypot(dx,dy)||1,svx=dx/L*v,svy=dy/L*v;
    addEnt({type:'garlic',wx:cam+mx,y:my,vxw:speed+svx,vy:svy,rot:Math.random()*6,spin:rand(-9,9)});
  }
  sfx.boom();shake=Math.max(shake,6);
  for(let i=0;i<6;i++)addPart({kind:'puff',x:cam+mx-6,y:my+rand(-6,6),vx:rand(-80,-20),vy:rand(-30,10),life:rand(.4,.7),size:rand(5,9),color:'#cfc8d8'});
  popText(e.wx-10,G-150,TL('blam'),C.warn,24);
}
function trapEdge(e){return G-(G-e.top)*Math.min(1.08,easeBack(e.k));}
function easeBack(k){const c=1.6;k=clamp(k,0,1);return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2);}
function baitNet(e){
  const k=e.state==='throw'?smooth(Math.min(1,e.k)):1;
  return {x:lerp(e.wx,e.nx,k),y:lerp(G-30,G-112,k),r:lerp(18,74,k)};
}
function bossNext(b){
  b.attack=(b.attack+1)%3;
  if(Math.random()<0.55)popText(b.wx,b.y-104,TB('bird','taunt'),C.wool,18);
  if(b.attack===0){b.state='swoopWarn';b.t=1.0;b.lane=clamp(P.y,PT()+40,PB()-40);sfx.warn();}
  else if(b.attack===1){b.state='eggs';b.eggs=5+(3-b.hp);b.t=0.6;}
  else{b.state='chicks';b.t=1.7;spawnChicks();sfx.cluck();}
}
function spawnChicks(){
  const n=5,top=PT()+30,bot=PB()-20,step=(bot-top)/(n-1),gap=randi(0,n-2);
  for(let i=0;i<n;i++){if(i===gap||i===gap+1)continue;addEnt({type:'rooster',chick:true,wx:cam+W+40,y:top+i*step,state:'warn',t:0.95+Math.random()*0.25,ph:Math.random()*6});}
}
function bossHit(b,byScream){
  b.hp--;sfx.bonk();sfx.cluck();feathers(b.wx,b.y-34,14,'#c99462');shake=Math.max(shake,8);
  popText(b.wx,b.y-96,byScream?'SHRIEK!':'BONK!',C.warn,30);popText(b.wx,b.y-128,TB('bird','hit'),C.wool,19);run.bonks+=5;
  if(!byScream){P.vy=-380;P.grace=Math.max(P.grace,0.7);}
  for(const e of ents)if((e.type==='egg')||(e.type==='rooster'&&e.chick)){e.dead=true;burst(e.wx,e.y,6,'#fff',120);}
  if(b.hp<=0)bossDefeated(b);else{b.state='hurt';b.t=0;}
}
function bossDefeated(b){
  b.state='defeated';b.t=0;run.chests++;run.blood+=30;run.bonks+=10;save.stats.bosses++;mEv('boss');
  banner={text:TB('bird','name')+' defeated!',sub:'+1 rare chest  ·  +30 '+theme.item.short,t:0};sfx.best();
  popText(b.wx,b.y-110,TB('bird','defeat'),C.wool,22);
  if(mode==='story')addEnt({type:'lamb',wx:b.wx,y:b.y-20,i:2,ph:0,t:0,home:1});

function fbX(){return clamp(W*0.72,PX+200,PX+560);}
function fbZoneTop(){return G-0.5*(G-PT());}
function fbossNext(b){

function fbossFork(b){

function fbossBale(b){

function fbossHit(b,byScream){

function fbossDefeated(b){

}
function updateFBoss(b,dt){
  b.ph+=dt*10;
  if(b.state==='wait'){
    b.wx=b.startX+200;
    if(cam+W*0.5>b.startX){b.state='enter';b.t=0;b.sx=W+220;banner={text:TB('boss','name'),sub:'“'+TB('boss','intro')+'”',t:0};sfx.engine();sfx.warn();}
    return;
  }
  b.time+=dt;b.wx=cam+b.sx;
  const moving=b.state==='enter'||b.state==='charge'||b.state==='back'||b.state==='giveup'||b.state==='stall'||(b.state==='hurt'&&b.hurtCoast);
  b.wheel+=dt*(moving?9:b.state==='rev'?14:0.5);
  b.lift=damp(b.lift,(b.state==='bales'||b.state==='rev'||b.state==='charge')?1:0,6,dt);
  b.dropT-=dt;
  if(b.dropT<=0&&b.state!=='defeated'&&b.state!=='giveup'){b.dropT=rand(1.6,2.4);const yy=rand(PT()+40,fbZoneTop()-40);addDrop(cam+W+30,yy);addDrop(cam+W+72,yy);}
  if(b.time>CONFIG.bossTime&&b.state!=='defeated'&&b.state!=='giveup'){b.state='giveup';b.t=0;popText(b.wx,G-200,TB('boss','giveup'),C.wool,22);}
  if((b.state==='stall'||b.state==='defeated'||b.state==='rev')&&Math.random()<dt*(b.state==='rev'?14:9))
    addPart({kind:'puff',x:cam+b.sx-41,y:G-108,vx:rand(-30,20),vy:rand(-70,-40),life:rand(.6,1),size:rand(5,9),color:b.state==='rev'?'#8a8598':'#3f3a48'});
  switch(b.state){
    case 'enter':b.t+=dt;b.sx=damp(b.sx,fbX(),3.2,dt);if(b.t>1.4)fbossNext(b);break;
    case 'forks':b.sx=damp(b.sx,fbX(),3,dt);b.t-=dt;
      if(b.t<=0){if(b.n<3){fbossFork(b);b.n++;b.t=b.n<3?1.0:1.1;}else fbossStall(b);}
      break;
    case 'bales':b.t-=dt;
      if(b.t<=0){if(b.n<3){fbossBale(b);b.n++;b.t=b.n<3?0.55:1.3;}else fbossStall(b);}
      break;
    case 'rev':b.t-=dt;if(b.t<=0){b.state='charge';sfx.whoosh();sfx.engine();}break;
    case 'charge':b.sx-=560*dt;if(b.sx<-280){b.state='return';b.t=0.7;b.after='stall';}break;
    case 'return':b.t-=dt;if(b.t<=0){b.sx=W+220;b.state='back';}break;
    case 'back':b.sx=damp(b.sx,fbX(),3.5,dt);if(Math.abs(b.sx-fbX())<8){if(b.after==='stall')fbossStall(b);else{b.stalls++;fbossNext(b);}}break;
    case 'stall':b.t+=dt;b.sx-=b.coast*dt;if(b.sx<-260){b.state='return';b.t=0.5;b.after='next';}break;
    case 'hurt':b.t+=dt;
      if(b.hurtCoast){b.sx-=b.coast*dt;if(b.sx<-260){b.state='return';b.t=0.5;b.after='next';}}
      else{b.sx=damp(b.sx,fbX(),3,dt);if(b.t>1.1){b.stalls++;fbossNext(b);}}
      break;
    case 'defeated':b.t+=dt;b.sx+=60*dt;if(Math.random()<dt*20)burst(b.wx+rand(-60,60),G-rand(20,90),3,'#ff9d4d',120);if(b.t>2.6){b.dead=true;endBoss();}break;
    case 'giveup':b.t+=dt;b.sx+=280*dt;if(b.sx>W+280){b.dead=true;endBoss();}break;
  }
}
function endBoss(){if(mode==='story'){if(state==='playing')levelCleared();return;}gen.paused=false;gen.x=Math.max(gen.x,cam+W+150);gen.nextBoss=gen.x+CONFIG.bossEvery;gen.last='free';}
function updateBoss(b,dt){
  b.ph+=dt*(b.state==='tired'?8:18);
  if(b.state==='wait'){
    b.wx=b.startX+200;
    if(cam+W*0.5>b.startX){b.state='enter';b.t=0;b.sx=W+120;b.y=PT()+110;banner={text:TB('bird','name'),sub:'“'+TB('bird','intro')+'”',t:0};sfx.crow();sfx.warn();}
    return;
  }
  b.time+=dt;b.wx=cam+b.sx;
  b.dropT-=dt;
  if(b.dropT<=0&&b.state!=='defeated'&&b.state!=='giveup'){b.dropT=rand(1.6,2.4);const yy=rand(PT()+40,PB()-60);addDrop(cam+W+30,yy);addDrop(cam+W+72,yy);}
  if(b.time>CONFIG.bossTime&&b.state!=='defeated'&&b.state!=='giveup'){b.state='giveup';b.t=0;popText(b.wx,b.y-90,TB('bird','giveup'),C.wool,22);}
  switch(b.state){
    case 'enter':b.t+=dt;b.sx=damp(b.sx,W*0.78,4,dt);b.y=damp(b.y,PT()+110,4,dt);if(b.t>1.1)bossNext(b);break;
    case 'swoopWarn':b.t-=dt;b.sx=damp(b.sx,W*0.86,5,dt);b.y=damp(b.y,b.lane,6,dt);if(b.t<=0){b.state='swoop';sfx.crow();}break;
    case 'swoop':b.sx-=560*dt;b.y=b.lane+Math.sin(b.ph*0.3)*4;if(b.sx<-140){b.state='tired';b.tired++;b.sx=W+70;b.y=rand(PT()+140,PB()-140);sfx.cluck();}break;
    case 'eggs':
      b.sx=damp(b.sx,W*0.72,3,dt);b.y=damp(b.y,PT()+60,3,dt);b.t-=dt;
      if(b.t<=0&&b.eggs>0){b.t=0.5;b.eggs--;addEnt({type:'egg',wx:b.wx,y:b.y-6,vy:60});sfx.plop();}
      if(b.eggs<=0&&b.t<=0){b.state='leave';b.t=0;}
      break;
    case 'chicks':b.t-=dt;b.sx=damp(b.sx,W*0.8,3,dt);if(b.t<=0){b.state='leave';b.t=0;}break;
    case 'leave':b.sx+=380*dt;b.y-=60*dt;if(b.sx>W+120){b.state='tired';b.tired++;b.sx=W+70;b.y=rand(PT()+140,PB()-140);}break;
    case 'tired':b.sx-=170*dt;b.y+=Math.sin(b.ph*0.25)*20*dt;if(b.sx<-120){b.state='enter';b.t=0;b.sx=W+120;b.y=PT()+110;}break;
    case 'hurt':b.t+=dt;b.sx+=420*dt;b.y-=200*dt;if(b.t>0.9){b.state='enter';b.t=0;b.sx=W+120;b.y=PT()+110;}break;
    case 'defeated':b.t+=dt;b.sx+=200*dt;b.y-=160*dt;if(b.t>2.2){b.dead=true;endBoss();}break;
    case 'giveup':b.t+=dt;b.sx+=300*dt;b.y-=120*dt;if(b.t>1.6){b.dead=true;endBoss();}break;
  }
}
function updateEnt(e,dt){
  const sx=e.wx-cam;
  switch(e.type){
    case 'drop':
      e.ph+=dt*4;
      if((P.pw.magnet>0||P.pw.vampire>0)&&!P.dead){
        const dx=(cam+PX)-e.wx,dy=P.y-e.y,dd=Math.hypot(dx,dy);
        if(dd<200&&dd>0.01){const s=Math.min(dd,(520+speed)*dt);e.wx+=dx/dd*s;e.y+=dy/dd*s;}
      }
      break;
    case 'power':e.ph+=dt;break;
    case 'sheep':
      e.ph+=dt*3;
      if(e.state==='graze'){const dx=e.wx-(cam+PX);e.alert=dx<260&&dx>-40;}
      else{e.t+=dt;const k=smooth(Math.min(1,e.t/0.45));e.wx=lerp(e.wx0,cam+PX,k);e.y=lerp(e.y0,P.y+18,k);if(e.t>=0.45)e.dead=true;}
      break;
    case 'chicken':
      if(e.state==='idle'){
        e.ph+=dt*6;
        const trig=230+speed*0.55+e.late*speed;
        if(!P.dead&&state==='playing'&&e.wx-(cam+PX)<trig){e.state='warn';e.t=0.45;sfx.cluck();spotlight('chicken',e);}
      }else if(e.state==='warn'){e.t-=dt;e.ph+=dt*20;if(e.t<=0){e.state='air';e.vy=-Math.sqrt(2*900*e.h);e.vx=-70;sfx.cluck();}}
      else if(e.state==='air'){e.vy+=900*dt;e.y+=e.vy*dt;e.wx+=e.vx*dt;e.ph+=dt*30;if(e.y>=G-2&&e.vy>0){e.y=G-2;e.vy=0;e.state='landed';}}
      else if(e.state==='landed')e.ph+=dt*6;
      else if(e.state==='flee'){e.vy=Math.min(e.vy,-260);e.y+=e.vy*dt;e.wx+=(speed+140)*dt;e.ph+=dt*34;if(e.y<-80)e.dead=true;}
      break;
    case 'farmer':
      if(e.state==='idle'){
        const throwDist=clamp(W-PX-50,210,420);
        if(!P.dead&&state==='playing'&&sx-PX<throwDist+speed*0.85&&sx-PX>150){
          if(e.fast){e.state='fastWind';e.t=CONFIG.fastWind;e.locked=false;e.aimY=clamp(P.y,PT(),PB());sfx.growl();
            spotlight('fast',e);}
          else{e.state='wind';e.t=0.85;sfx.warn();spotlight('farmer',e);}
          if(Math.random()<0.45)popText(cam+Math.min(sx,W-90),G-168,pickL('spot'),C.wool,17);
        }
      }else if(e.state==='fastWind'){
        e.t-=dt;
        if(e.t>CONFIG.fastLock)e.aimY=clamp(P.y,PT(),PB());
        else if(!e.locked){e.locked=true;sfx.lock();}
        if(e.t<=0){if(sx-PX>90&&!P.dead)throwFork(e,true);e.throws=0;e.state='fist';e.t=0.5;}
      }else if(e.state==='wind'){
        e.t-=dt;if(e.tut&&!run.tutScreamed)e.t=Math.max(e.t,0.3);
        if(e.t<=0){
          if(sx-PX>110&&!P.dead){throwFork(e);e.throws--;}else e.throws=0;
          e.state=e.throws>0?'rewind':'fist';e.t=0.5;
        }
      }else if(e.state==='rewind'){e.t-=dt;if(e.t<=0){e.state='wind';e.t=0.6;sfx.warn();}}
      else if(e.state==='fist')e.ph+=dt*14;
      else if(e.state==='flee'){e.wx+=(speed+60)*dt;e.ph+=dt*18;if(sx>W+80)e.dead=true;}
      break;
    case 'fork':
      e.wx+=e.vxw*dt;e.y+=e.vy*dt;
      if(e.y>G+10||sx<-120)e.dead=true;
      break;
    case 'hen':
      if(e.state==='wait'){if(sx<W+30)e.state='fly';}
      if(e.state==='fly'&&sx<W-50&&sx>PX+100)spotlight('hen',e);
      else if(e.state==='fly'){
        e.wx+=speed*0.6*dt;e.ph+=dt*18;e.drop-=dt;
        if(sx<PX+70)e.state='leave';
        else if(e.drop<=0&&e.eggs>0&&sx<W-10){e.state='lay';e.t=0.3;}
      }else if(e.state==='lay'){
        e.wx+=speed*0.6*dt;e.ph+=dt*34;e.t-=dt;
        if(e.t<=0){addEnt({type:'egg',wx:e.wx,y:e.y+14,vy:40});e.eggs--;e.drop=rand(.8,1.0);e.state=e.eggs>0?'fly':'leave';sfx.plop();}
      }else if(e.state==='leave'){e.wx+=speed*0.6*dt;e.y-=70*dt;e.ph+=dt*18;if(e.y<-60)e.dead=true;}
      else if(e.state==='flee'){e.y-=280*dt;e.wx+=speed*dt;e.ph+=dt*30;if(e.y<-60)e.dead=true;}
      break;
    case 'egg':
      e.vy+=800*dt;e.y+=e.vy*dt;
      if(e.y>=G-6){e.dead=true;decorNear.push({x:e.wx,type:'splat',seed:Math.random()*100,s:1});if(sx>0&&sx<W)sfx.splat();}
      break;
    case 'boss':updateBoss(e,dt);break;
    case 'fboss':updateFBoss(e,dt);break;
    case 'bale':
      e.wx+=(speed+e.vxs)*dt;e.vy+=700*dt;e.y+=e.vy*dt;e.rot+=e.spin*dt;
      if(e.y>G-14&&e.vy>0){e.y=G-14;if(e.bounces<1){e.vy*=-0.45;e.bounces++;if(sx>0&&sx<W)sfx.thud();}else e.vy=0;}
      if(sx<-60)e.dead=true;
      break;
    case 'hunter':
      e.ph+=dt*6;
      if(e.state==='idle'){
        const range=Math.max(W-PX-40,320)+speed*1.0;
        if(!P.dead&&state==='playing'&&sx-PX<range&&sx-PX>200){e.state='aim';e.t=CONFIG.hunterAim;e.locked=false;e.aimY=clamp(P.y,PT(),PB());sfx.cock();
          spotlight('hunter',e);}
      }else if(e.state==='aim'){
        e.t-=dt;
        if(e.t>0.5)e.aimY=clamp(P.y,PT(),PB());else if(!e.locked){e.locked=true;sfx.lock();}
        if(e.t<=0){if(sx-PX>110&&!P.dead)fireGarlic(e);e.volleys--;e.state=e.volleys>0?'reload':'done';e.t=1.1;}
      }else if(e.state==='reload'){e.t-=dt;if(e.t<=0){e.state='aim';e.t=CONFIG.hunterAim-0.2;e.locked=false;sfx.cock();}}
      else if(e.state==='flee'){e.wx+=(speed+70)*dt;e.ph+=dt*12;if(sx>W+80)e.dead=true;}
      break;
    case 'garlic':
      e.wx+=e.vxw*dt;e.y+=e.vy*dt;e.rot+=e.spin*dt;
      if(e.y>G-4){e.dead=true;if(sx>0&&sx<W){puff(e.wx,G-6,3,'#efe9f2');sfx.splat();}}
      if(sx<-60||e.y<-60)e.dead=true;
      break;
    case 'trap':
      e.ph+=dt*6;
      if(e.state==='idle'){
        if(!P.dead&&state==='playing'&&(e.wx-cam)-PX<speed*1.45+40&&(e.wx-cam)-PX>60){e.state='warn';e.t=0.45;e.bst='lever';sfx.rattle();
          spotlight('trap',e);}
      }else if(e.state==='warn'){e.t-=dt;if(e.t<=0){e.state='deploy';e.k=0;sfx.boing();}}
      else if(e.state==='deploy'){e.k+=dt/0.55;if(e.k>=1){e.k=1;e.state='set';e.bst='cheer';sfx.laugh();}}
      else if(e.state==='torn'){e.k=Math.max(0,e.k-dt*1.6);}
      if(e.bst==='flee')e.bwx+=(speed+70)*dt;
      break;
    case 'bait':
      e.ph+=dt*6;
      if(e.state==='hide'){
        if(e.nx-cam<W-60)spotlight('bait',e);
        const dx=(e.nx-cam)-PX;
        if(!P.dead&&state==='playing'&&dx<75&&dx>-30&&P.y>G-280){e.state='peek';e.t=0.25;sfx.warn();}
      }else if(e.state==='peek'){e.t-=dt;if(e.t<=0){e.state='throw';e.k=0;sfx.whoosh();popText(e.wx,G-120,TL('gotcha'),C.warn,24);}}
      else if(e.state==='throw'){e.k+=dt/0.3;if(e.k>=1){e.state='net';e.t=0.55;}}
      else if(e.state==='net'){e.t-=dt;if(e.t<=0){e.state='fall';e.t=0;}}
      else if(e.state==='fall'){e.t+=dt;if(e.t>0.5){e.state='done';e.t=0;popText(e.wx,G-110,e.sheep.state==='taken'?TL('baitWin'):TL('baitLose'),C.wool,20);}}
      else if(e.state==='flee'){e.wx+=(speed+70)*dt;}
      break;
    case 'chest':e.ph+=dt;break;
    case 'marker':updateMarker(e,dt);break;
    case 'tip':if(!e.fired&&cam+PX>e.wx){e.fired=1;e.dead=true;setTip(e.step);}break;
    case 'lamb':updateLamb(e,dt);break;
    case 'finish':updateFinish(e,dt);break;
    case 'rooster':
      if(e.state==='pending'){
        if(!P.dead&&state==='playing'&&sx<W+60){e.state='warn';e.t=0.95;e.y=clamp(P.y,PT()+10,PB()-20);sfx.warn();if(!e.chick)spotlight('rooster',e);}
      }else if(e.state==='warn'){e.t-=dt;e.wx=cam+W+40;if(e.t<=0){e.state='fly';e.chick?sfx.cluck():sfx.crow();}}
      else if(e.state==='fly'){e.wx-=300*dt;e.ph+=dt*30;}
      else if(e.state==='flee'){e.y-=300*dt;e.wx+=(speed+100)*dt;e.ph+=dt*30;if(e.y<-80)e.dead=true;}
      break;
  }
}
function collide(){
  const pwx=cam+PX,py=P.y,R=CONFIG.hitR;
  const inv=P.pw.shield>0||P.pw.boost>0||P.pw.vampire>0||P.grace>0||godMode;
  const hurt=(e,proj)=>{
    if(inv){
      if(proj){e.dead=true;burst(e.wx,e.y,8,'#fff',140);sfx.clank();}
      else{bonk(e);if(P.pw.vampire>0){run.blood+=2;addScream(1);burst(e.wx,(e.y||G-60),10,C.blood,170);popText(cam+PX+12,P.y-58,'CHOMP! +2',C.blood,22);}}
    }else die(causeOf(e,proj),e.type==='fork'&&e.fast?'fastfork':e.type);
  };
  for(const e of ents){
    if(e.dead)continue;
    const sx=e.wx-cam;if(sx<-140||sx>W+140)continue;
    switch(e.type){
      case 'drop':if(hit(pwx,py,R+2,e.wx,e.y,12)){e.dead=true;collectDrop(e);}break;
      case 'power':if(hit(pwx,py,R+2,e.wx,e.y,18)){e.dead=true;applyPower(e.kind,e.wx,e.y);}break;
      case 'sheep':{const rx=60+30*up('pen'),ry=150+30*up('pen');if(e.state==='graze'&&Math.abs(e.wx-pwx)<rx&&py>G-16-ry)stealSheep(e);}break;
      case 'stake':
        for(const r of e.rects){
          if(circRect(pwx,py,R,e.wx+r[0],r[2],e.wx+r[1],r[3])){
            if(inv){if(!e.hitFx){e.hitFx=true;burst(pwx+10,py,10,C.gold,160);sfx.clank();}}
            else die('stake','stake');
            break;
          }
        }
        if(!e.passed&&!P.dead&&e.wx+e.w<pwx-R){
          e.passed=true;let clr=1e9;
          if(e.kind!=='tower')clr=Math.min(clr,(py-R)-e.top);
          if(e.kind!=='branch')clr=Math.min(clr,e.bot-(py+R));
          if(clr<10&&clr>-6){P.expr='scared';P.exprT=0.5;popText(pwx-10,py-34,pickL('phew'),C.wool,18);mEv('phew');}
        }
        break;
      case 'chicken':if(e.state!=='flee'&&hit(pwx,py,R,e.wx,e.y-19,15))hurt(e);break;
      case 'rooster':if(e.state==='fly'&&hit(pwx,py,R,e.wx,e.y,e.chick?12:17))hurt(e);break;
      case 'lamb':if(hit(pwx,py,R+4,e.wx,e.y,21))saveLamb(e);break;
      case 'chest':if(hit(pwx,py,R+2,e.wx,e.y,20)){e.dead=true;run.chests++;sfx.best();burst(e.wx,e.y,18,C.gold,200);popText(e.wx,e.y-30,'RARE CHEST!',C.gold,26);mEv('chest');toast('Rare chest! Open it in your castle');}break;
      case 'boss':
        if(e.state==='wait'||e.state==='defeated'||e.state==='giveup'||e.state==='hurt')break;
        if(hit(pwx,py,R,e.wx,e.y-34,30)){if(e.state==='tired')bossHit(e,false);else if(!inv)die('bird','boss');}
        break;
      case 'hen':if((e.state==='fly'||e.state==='lay'||e.state==='leave')&&hit(pwx,py,R,e.wx,e.y-19,15))hurt(e);break;
      case 'farmer':if(e.state!=='flee'&&hit(pwx,py,R,e.wx,G-50,22))hurt(e);break;
      case 'fork':{const tx=e.wx+Math.cos(e.rot)*28,ty=e.y+Math.sin(e.rot)*28;if(hit(pwx,py,R,tx,ty,9)||hit(pwx,py,R,e.wx,e.y,6))hurt(e,true);}break;
      case 'egg':if(hit(pwx,py,R,e.wx,e.y,8))hurt(e,true);break;
      case 'garlic':if(hit(pwx,py,R,e.wx,e.y,9))hurt(e,true);break;
      case 'bale':if(hit(pwx,py,R,e.wx,e.y,15))hurt(e,true);break;
      case 'fboss':{
        const st=e.state;if(st==='wait'||st==='defeated'||st==='giveup'||st==='return')break;
        if(st==='stall'&&hit(pwx,py,R,e.wx+31,G-186,26)){fbossHit(e,false);break;}
        if(st==='hurt')break;
        const bx=e.wx;let touch=circRect(pwx,py,R-2,bx-100,G-72,bx+76,G+30)||circRect(pwx,py,R-2,bx-47,G-106,bx-33,G-62);
        if(st==='charge'||st==='rev')touch=touch||circRect(pwx,py,R-2,bx-108,fbZoneTop(),bx-84,G-28);
        if(touch){if(inv){P.vy=-420;P.grace=Math.max(P.grace,0.6);sfx.bonk();}else die('tractor','fboss');}
      }break;
      case 'hunter':if(e.state!=='flee'&&hit(pwx,py,R,e.wx,G-50,22))hurt(e);break;
      case 'trap':
        if((e.state==='deploy'||e.state==='set')&&circRect(pwx,py,R-2,e.wx,trapEdge(e),e.wx+e.w,G+40)){
          if(inv){e.state='torn';e.bst='flee';sfx.rip();burst(pwx,py,10,'#d9c9a0',160);popText(pwx,py-30,'RIIIP!',C.warn,22);}else die('net','trap');
        }
        if(e.bst!=='flee'&&hit(pwx,py,R,e.bwx,G-50,22)){if(inv){e.bst='flee';if(e.state==='idle'||e.state==='warn')e.state='off';run.bonks++;sfx.bonk();shake=Math.max(shake,5);popText(cam+PX+16,P.y-30,'BONK!',C.warn,24);}else die('farmer');}
        break;
      case 'bait':
        if(e.state==='throw'&&e.k>0.45||e.state==='net'){const n=baitNet(e);
          if(hit(pwx,py,R-2,n.x,n.y,n.r)){if(inv){e.state='fall';e.t=0.2;sfx.rip();burst(pwx,py,10,'#d9c9a0',160);}else die('net','bait');}}
        break;
    }
    if(P.dead)break;
  }
}
function updatePlayer(dt){
  P.flapK=Math.max(0,P.flapK-dt*4);
  P.blinkT-=dt;if(P.blinkT<=0){P.blink=0.13;P.blinkT=rand(2,4.5);}if(P.blink>0)P.blink-=dt;
  P.earT-=dt;if(P.earT<=0){P.ear=0.3;P.earT=rand(1.5,4);}if(P.ear>0)P.ear-=dt;
  if(P.exprT>0){P.exprT-=dt;if(P.exprT<=0&&!P.dead)P.expr=P.pw.boost>0||P.pw.vampire>0?'angry':'normal';}
  for(const k in P.pw){
    if(P.pw[k]>0){P.pw[k]-=dt;if(P.pw[k]<=0){P.pw[k]=0;if(k!=='magnet')P.grace=Math.max(P.grace,CONFIG.grace);}}
  }
  if(P.grace>0)P.grace-=dt;
  if(run.screamHintT>0)run.screamHintT-=dt;
  if(run.screamMsgT>0)run.screamMsgT-=dt;
  if(run.toastT>0)run.toastT-=dt;
  if(run.screamNudge>0)run.screamNudge-=dt;
  P.vy=Math.min(P.vy+CONFIG.gravity*dt,CONFIG.maxFall);

  if(!P.dead){
    if(P.y<16){P.y=16;if(P.vy<0)P.vy=0;}
    P.rot=damp(P.rot,clamp(P.vy/750,-0.42,0.8),10,dt);

      if(P.pw.shield>0||P.pw.boost>0||P.pw.vampire>0||P.grace>0||godMode||state==='finishing'){P.y=G-24;P.vy=-430;burst(cam+PX,G-4,8,C.gold,140);sfx.bonk();}
      else{P.y=G-24;die('ground');}
    }
    if(P.pw.boost>0&&Math.random()<dt*24)addPart({kind:'bat',x:cam+PX-20,y:P.y+rand(-14,14),vx:-60,vy:rand(-30,30),life:.6,size:rand(.5,.8),color:'#1a0d1c'});
    if(P.pw.vampire>0){if(Math.random()<dt*20)addPart({kind:'bat',x:cam+PX-24,y:P.y+rand(-18,18),vx:-80,vy:rand(-40,40),life:.7,size:rand(.45,.75),color:'#6a0d22'});
      if(Math.random()<dt*30)addPart({kind:'spark',x:cam+PX-30,y:P.y+rand(-14,14),vx:-90,vy:rand(-20,20),life:.4,size:2.6,color:C.blood,grav:0});}
    if(Math.random()<dt*14){
      const sk=(run&&run.skin)||activeSkin();
      if(sk==='rainbow')addPart({kind:'spark',x:cam+PX-34,y:P.y+rand(-12,12),vx:-70,vy:rand(-20,20),life:.5,size:3.2,color:`hsl(${Math.floor(time*300)%360},90%,62%)`,grav:0});
      else if(sk==='disco'||sk==='golden')addPart({kind:'spark',x:cam+PX+rand(-30,30),y:P.y+rand(-30,30),vx:-40,vy:-20,life:.45,size:2.6,color:sk==='golden'?C.gold:['#ff4fd8','#3ef0ff','#ffd23f'][Math.floor(Math.random()*3)],grav:0});
      else if(sk==='pghost'||sk==='ghost')addPart({kind:'puff',x:cam+PX-28,y:P.y+rand(-6,16),vx:-60,vy:-10,life:.5,size:4,color:'rgba(210,235,255,0.55)'});
    }
  }else{
    P.rot+=P.spin*dt;
    if(P.y>G-24){
      P.y=G-24;
      if(P.bounces<1){P.vy=-200;P.bounces++;P.spin*=0.5;puff(cam+PX,G-6,4);sfx.thud();shake=Math.max(shake,6);}
      else{P.vy=0;P.spin=0;}
    }
    if(state==='dying'&&stateT>1.15)gameOver();
  }
}
function menuIdle(dt){

  P.earT-=dt;if(P.earT<=0){P.ear=0.3;P.earT=rand(1.5,4);}if(P.ear>0)P.ear-=dt;

  for(const b of bats){b.x+=(b.vx-speed*0.3)*dt;b.ph+=dt*14;b.y=b.y0+Math.sin(b.ph*0.2)*b.amp;}

function updateFx(dt){
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.grav*dt;p.life-=dt;p.rot+=p.vr*dt;if(p.kind==='feather'){p.vx*=0.98;}}
  for(const t of texts){t.y-=36*dt;t.life-=dt;}
}
function update(dt){
  fadeIn=Math.max(0,fadeIn-dt*3.2);
  if(run&&run.spot){run.spot.rt+=dt;if(run.spot.rt>4)run.spot=null;}
  if(state==='playing'&&run&&(run.tut||run.spot)){timeScale=damp(timeScale,((run.tut&&tutSlow())||spotSlow())?0.32:1,7,dt);dt*=timeScale;}else timeScale=1;
  time+=dt;stateT+=dt;boil=Math.floor(time*7);
  shake=Math.max(0,shake-dt*40);flash=Math.max(0,flash-dt*2);
  if(state==='paused')return;
  if(state==='resuming'){resumeT-=dt;if(resumeT<=0){state='playing';}return;}
  updateBats(dt);
  if(state==='ready'){readyTick(dt);updateFx(dt);return;}
  if(state==='menu'||state==='missions'||state==='story'||state==='cutscene'){menuIdle(dt);updateFx(dt);return;}
  if(state==='castle'){
    menuIdle(dt);updateFx(dt);stageT+=dt;castleMsgT=Math.max(0,castleMsgT-dt);castleShakeT=Math.max(0,castleShakeT-dt);
    if(chestAnim){const pr=chestAnim.t;chestAnim.t+=dt;if(pr<0.75&&chestAnim.t>=0.75){sfx.best();if(chestAnim.px!=null)for(let i=0;i<30;i++)addPart({kind:'spark',x:chestAnim.px,y:chestAnim.py,vx:rand(-170,170),vy:rand(-240,-40),life:rand(.5,1),size:rand(2,4.5),color:[C.gold,'#fff1a8',C.blood][i%3],grav:260});}}
    return;
  }
  if(state==='over'){updateFx(dt);return;}
  const d=mode==='story'&&curLevel?curLevel.d:difficulty(cam);
  if(state==='playing'){
    run.t+=dt;
    const base=lerp(CONFIG.speedStart,CONFIG.speedMax,d);
    speed=damp(speed,base*(P.pw.boost>0?1.85:1)*(P.pw.vampire>0?1.35:1),P.pw.boost>0||P.pw.vampire>0?5:3,dt);
  }else speed=damp(speed,0,2.2,dt);
  cam+=speed*dt;
  const wi=worldIndexAt(cam);
  if(state==='playing'&&wi!==worldIdx){worldIdx=wi;if(mode==='story'&&curLevel)banner={text:curLevel.name,sub:'Level '+curLevel.code,t:-0.4};else if(!run.tut&&(wi===0||TW().length>1))banner={text:TW()[wi%TW().length].name,t:wi===0?-3.2:0};}
  if(banner){banner.t+=dt;if(banner.t>2.8)banner=null;}
  while(!gen.paused&&gen.x<cam+W+500)genSection();
  spawnDecor();
  updatePlayer(dt);
  for(const e of ents)updateEnt(e,dt);
  if(state==='playing'){collide();missionsTick();tutTick(dt);}
  finishingTick(dt);
  if(run&&run.mPops&&run.mPops.length){run.mPops[0].t+=dt;if(run.mPops[0].t>2.9)run.mPops.shift();}
  updateFx(dt);
}
function cleanup(){
  ents=ents.filter(e=>!e.dead&&e.wx-cam>-320);
  parts=parts.filter(p=>p.life>0);texts=texts.filter(t=>t.life>0);
  const off=cam*0.35;

  bats=bats.filter(b=>b.x>-40);
}

/* ================= Drawing helpers ================= */
function smoothClosed(pts){
  const n=pts.length;ctx.beginPath();
  ctx.moveTo((pts[n-1][0]+pts[0][0])/2,(pts[n-1][1]+pts[0][1])/2);
  for(let i=0;i<n;i++){const p=pts[i],q=pts[(i+1)%n];ctx.quadraticCurveTo(p[0],p[1],(p[0]+q[0])/2,(p[1]+q[1])/2);}
  ctx.closePath();
}
function wobPoly(pts,seed,amp=1.1){
  ctx.beginPath();
  for(let i=0;i<pts.length;i++){
    const p=pts[i],x=p[0]+(hash(seed+i*3.3+boil*1.9)-0.5)*2*amp,y=p[1]+(hash(seed+i*5.1+boil*2.7)-0.5)*2*amp;
    i?ctx.lineTo(x,y):ctx.moveTo(x,y);
  }
  ctx.closePath();
}
function wobCircle(x,y,r,seed,amp=1,n=14){
  const pts=[];
  for(let i=0;i<n;i++){const a=i/n*Math.PI*2,rr=r+(hash(seed+i*3.1+boil*7.7)-0.5)*2*amp;pts.push([x+Math.cos(a)*rr,y+Math.sin(a)*rr]);}
  smoothClosed(pts);
}
function wobRect(x,y,w,h,seed,amp=1.2){
  const r=Math.min(10,w/4,h/4);
  const pts=[[x+r,y],[x+w/2,y],[x+w-r,y],[x+w,y],[x+w,y+r],[x+w,y+h/2],[x+w,y+h-r],[x+w,y+h],[x+w-r,y+h],[x+w/2,y+h],[x+r,y+h],[x,y+h],[x,y+h-r],[x,y+h/2],[x,y+r],[x,y]];
  for(let i=0;i<pts.length;i++){pts[i][0]+=(hash(seed+i*2.1+boil*3.3)-0.5)*2*amp;pts[i][1]+=(hash(seed+i*4.7+boil*1.3)-0.5)*2*amp;}
  smoothClosed(pts);
}
function fluff(cx,cy,rx,ry,n,bump,seed){
  ctx.beginPath();
  for(let i=0;i<=n;i++){
    const k=i%n,a=k/n*Math.PI*2-Math.PI/2,j=(hash(seed+k*1.7+boil*0.37)-0.5)*0.08;
    const px=cx+Math.cos(a)*rx*(1+j),py=cy+Math.sin(a)*ry*(1+j);
    if(i===0){ctx.moveTo(px,py);continue;}
    const am=(i-0.5)/n*Math.PI*2-Math.PI/2,b=1+bump*(0.8+0.4*hash(seed+i*2.3));
    ctx.quadraticCurveTo(cx+Math.cos(am)*rx*b,cy+Math.sin(am)*ry*b,px,py);
  }
  ctx.closePath();
}
function inkIt(fill,lw=2.5,stroke=C.ink){if(fill){ctx.fillStyle=fill;ctx.fill();}if(lw){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();}}
function txt(s,x,y,{font=hand(22),col=C.wool,align='left',base='alphabetic',stroke=C.ink,sw=5}={}){
  ctx.font=font;ctx.textAlign=align;ctx.textBaseline=base;
  if(stroke){ctx.lineWidth=sw;ctx.strokeStyle=stroke;ctx.lineJoin='round';ctx.strokeText(s,x,y);}
  ctx.fillStyle=col;ctx.fillText(s,x,y);
}
function fitSize(s,maxW,size){ctx.font=hand(size);const w=ctx.measureText(s).width;return w<=maxW?size:Math.max(12,Math.floor(size*maxW/w));}
function dropShape(){
  ctx.beginPath();ctx.moveTo(0,-11);ctx.bezierCurveTo(4,-5,8,-1,8,4);ctx.arc(0,4,8,0,Math.PI,false);ctx.bezierCurveTo(-8,-1,-4,-5,0,-11);ctx.closePath();
}

function drawSheepula(x,y,rot,o){

  if(id==='business'&&bizBonk())expr='dizzy';
  ctx.save();ctx.translate(x,y);ctx.rotate(rot+extraRot);
  if(o.scale)ctx.scale(o.scale,o.scale);
  ctx.lineJoin='round';ctx.lineCap='round';
  if(id==='ghost')ctx.globalAlpha*=0.3+0.65*(0.5+0.5*Math.sin(time*1.7));
  if(id==='pghost')ctx.globalAlpha*=0.72+0.18*Math.sin(time*3);
  const flying=o.flying,k=flying?1:0.4,fl=flying?Math.sin(time*15)*5+P.flapK*9:Math.sin(time*1.8)*1.2;
  if(s.sheet){ghostSheet(flying,expr,o);ctx.restore();return;}
  curWool=s.wool;
  const ink=s.ink||C.ink,legCol=id==='business'?'#2a2f3a':'#3b2c3d';
  // behind the body
  if(id==='devil')devilTail();
  if(id==='astronaut'){wobRect(-40,-14,16,28,5,0.4);inkIt('#c3c8d6',2);ctx.strokeStyle=C.ink;ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(-32,-14);ctx.lineTo(-30,-26);ctx.stroke();ctx.beginPath();ctx.arc(-30,-27,2.4,0,7);inkIt(Math.floor(time*2.5)%2?'#ff4d6d':'#ffe066',1);
    if(o.flying)for(let i=0;i<2;i++){const k=(time*3+i*0.5)%1;ctx.save();ctx.globalAlpha*=1-k;ctx.beginPath();ctx.arc(-34-k*20,16+i*4,3+k*4,0,7);ctx.fillStyle='#ffd27a';ctx.fill();ctx.restore();}}

  if(id==='beach')beachRing(false,o.flying);
  if(s.wings)batWings(s.wings,flying);
  const la=i=>flying?Math.sin(time*20+i*1.9)*0.55:(expr==='dizzy'?Math.sin(i)*0.4:0);
  sheepLeg(-27,19,la(0),14,legCol);sheepLeg(-16,20,la(1),14,legCol);

  for(const [cx,cy] of [[-26,14],[-14,19],[-2,17]]){ctx.beginPath();ctx.arc(cx,cy,3.6,0.2,Math.PI*1.4);ctx.stroke();}

  sheepLeg(4,22,la(2),12,legCol);sheepLeg(14,22,la(3),12,legCol);
  if(id==='beach')beachRing(true,o.flying);
  // collar band behind the chin
  ctx.save();ctx.translate(HDX,HDY);neckBack(s);ctx.restore();
  // head: big round wool head sitting low on the body, like the design sheet
  ctx.save();ctx.translate(14+HDX,-12+HDY);ctx.scale(HSC,HSC);ctx.translate(-14,12);
  if(s.big)bigCollar(s);

function playerLook(){

function palette(){
  const x=Math.max(0,cam),i=worldIndexAt(x);
  const ws=TW(),n=ws.length,cur=ws[i%n],prev=ws[(i+n-1)%n];
  const t=(i===0||mode==='story')?1:smooth(clamp((x-i*CONFIG.worldLen)/600,0,1));
  const m=k=>t>=1?cur[k]:mix(prev[k],cur[k],t);
  return {top:m('top'),bot:m('bot'),far:m('far'),mid:m('mid'),sil:m('sil'),ground:m('ground'),grass:m('grass'),
    amp:lerp(prev.amp,cur.amp,t),peak:lerp(prev.peak,cur.peak,t),snow:lerp(prev.snow,cur.snow,t)};
}
function ridgeY(wx,base,amp,seed,peak){
  const s=0.55*Math.sin(wx*0.0042+seed)+0.3*Math.sin(wx*0.0115+seed*2.3)+0.15*Math.sin(wx*0.029+seed*4.1);
  const p=(1-Math.abs(Math.sin(wx*0.0055+seed)))*1.3-0.3+0.12*Math.sin(wx*0.03+seed);
  return base-amp*(0.5+0.5*lerp(s,p,peak));
}
function drawRidge(par,base,amp,seed,peak,col,snow){
  const off=cam*par;
  ctx.beginPath();ctx.moveTo(-10,H+10);
  for(let x=-10;x<=W+24;x+=12)ctx.lineTo(x,ridgeY(x+off,base,amp,seed,peak));
  ctx.lineTo(W+24,H+10);ctx.closePath();ctx.fillStyle=col;ctx.fill();
  ctx.strokeStyle='rgba(12,6,20,0.45)';ctx.lineWidth=2;ctx.stroke();
  if(snow>0.05){
    ctx.save();ctx.globalAlpha=snow*0.85;ctx.strokeStyle='#eef1fb';ctx.lineWidth=5;ctx.beginPath();
    let drawing=false;
    for(let x=-10;x<=W+24;x+=6){
      const y=ridgeY(x+off,base,amp,seed,peak);
      if(y<base-amp*0.62){drawing?ctx.lineTo(x,y+2):ctx.moveTo(x,y+2);drawing=true;}else drawing=false;
    }
    ctx.stroke();ctx.restore();
  }
}
function drawSky(pal){
  const g=ctx.createLinearGradient(0,0,0,G);g.addColorStop(0,pal.top);g.addColorStop(1,pal.bot);
  ctx.fillStyle=g;ctx.fillRect(-20,-20,W+40,H+40);
  if(theme.sky!=='moon'){drawThemeSky();return;}
  ctx.fillStyle='#fff6dc';
  for(const s of stars){ctx.globalAlpha=0.35+0.55*Math.abs(Math.sin(time*s.s+s.p));ctx.fillRect(s.x,s.y,s.r,s.r);}
  ctx.globalAlpha=1;
  const mx=W*0.74,my=Math.min(118,H*0.17),r=50;
  const mg=ctx.createRadialGradient(mx,my,r*0.8,mx,my,r*3.2);mg.addColorStop(0,'rgba(248,234,176,0.32)');mg.addColorStop(1,'rgba(248,234,176,0)');
  ctx.fillStyle=mg;ctx.fillRect(mx-r*3.2,my-r*3.2,r*6.4,r*6.4);
  wobCircle(mx,my,r,91,0.9,18);inkIt(theme.moonCol||C.moon,2,'rgba(80,60,40,0.35)');
  ctx.fillStyle='rgba(214,196,130,0.55)';
  for(const [cx,cy,cr] of [[-14,-10,9],[16,8,7],[-6,20,5],[20,-18,4]]){ctx.beginPath();ctx.ellipse(mx+cx,my+cy,cr,cr*0.85,0,0,7);ctx.fill();}
}
function cloud(x,y,s,col){ctx.save();ctx.translate(x,y);ctx.scale(s,s);fluff(0,0,34,13,9,.45,x*0.01|0);inkIt(col||'#ffffff',2,'rgba(60,90,140,0.35)');ctx.restore();}
function drawThemeSky(){
  const sk=theme.sky;
  if(sk==='sun'){
    const sx=W*0.78,sy=Math.min(108,H*0.16),r=40;
    const gl=ctx.createRadialGradient(sx,sy,r*0.6,sx,sy,r*3.4);gl.addColorStop(0,'rgba(255,240,170,0.6)');gl.addColorStop(1,'rgba(255,240,170,0)');ctx.fillStyle=gl;ctx.fillRect(sx-r*3.4,sy-r*3.4,r*6.8,r*6.8);
    ctx.save();ctx.translate(sx,sy);ctx.rotate(time*0.15);ctx.strokeStyle='rgba(255,210,80,0.75)';ctx.lineWidth=4;
    for(let i=0;i<12;i++){ctx.rotate(Math.PI/6);ctx.beginPath();ctx.moveTo(r+8,0);ctx.lineTo(r+20+(i%2)*8,0);ctx.stroke();}ctx.restore();
    wobCircle(sx,sy,r,91,0.9,18);inkIt('#ffd84a',2.4,'rgba(170,110,20,0.6)');
    for(let i=0;i<4;i++){const cw=W+260,cx=((i*cw*0.29+90-time*9-cam*0.04)%cw+cw)%cw-130;cloud(cx,50+i*34+(i%2)*20,0.8+0.25*(i%3));}
  }else if(sk==='planet'){
    for(const [nx,ny,nr,col] of [[0.22,0.2,0.32,'rgba(150,70,220,0.28)'],[0.7,0.38,0.3,'rgba(40,170,200,0.2)'],[0.45,0.08,0.22,'rgba(230,80,160,0.2)']]){
      const x=W*nx-cam*0.02,y=G*ny,R=Math.max(W,G)*nr;const gn=ctx.createRadialGradient(x,y,0,x,y,R);gn.addColorStop(0,col);gn.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=gn;ctx.fillRect(x-R,y-R,R*2,R*2);}
    ctx.fillStyle='#fff6dc';
    for(const st of stars){ctx.globalAlpha=0.4+0.6*Math.abs(Math.sin(time*st.s+st.p));ctx.fillRect(st.x,st.y,st.r,st.r);ctx.fillRect((st.x*1.7)%W,(st.y*1.9)%G,st.r*0.7,st.r*0.7);}
    ctx.globalAlpha=1;
    const px=W*0.76,py=Math.min(112,H*0.17),r=38;
    ctx.save();ctx.translate(px,py);ctx.rotate(-0.35);
    ctx.beginPath();ctx.ellipse(0,0,r*1.9,r*0.45,0,Math.PI,0);ctx.strokeStyle='#e8c97a';ctx.lineWidth=6;ctx.stroke();
    ctx.restore();
    wobCircle(px,py,r,93,0.8,18);inkIt(theme.planetCol||'#d9784f',2.4,'rgba(60,20,10,0.6)');
    ctx.save();ctx.beginPath();ctx.arc(px,py,r-1,0,7);ctx.clip();ctx.fillStyle='rgba(255,210,150,0.35)';for(let i=-2;i<3;i++)ctx.fillRect(px-r,py+i*13-3,r*2,5);ctx.restore();
    ctx.save();ctx.translate(px,py);ctx.rotate(-0.35);ctx.beginPath();ctx.ellipse(0,0,r*1.9,r*0.45,0,0,Math.PI);ctx.strokeStyle='#e8c97a';ctx.lineWidth=6;ctx.stroke();ctx.restore();
    wobCircle(W*0.18,Math.min(70,H*0.1),12,7,0.5,12);inkIt('#c9c7d9',2);
  }else if(sk==='dawn'){
    ctx.fillStyle='#ffffff';for(const st of stars){if(st.y>G*0.25)continue;ctx.globalAlpha=0.25*Math.abs(Math.sin(time*st.s+st.p));ctx.fillRect(st.x,st.y,st.r,st.r);}ctx.globalAlpha=1;
    const sx=W*0.7,sy=G*0.52,r=46;
    const gl=ctx.createRadialGradient(sx,sy,r*0.5,sx,sy,r*4);gl.addColorStop(0,'rgba(255,236,200,0.75)');gl.addColorStop(1,'rgba(255,236,200,0)');ctx.fillStyle=gl;ctx.fillRect(sx-r*4,sy-r*4,r*8,r*8);
    wobCircle(sx,sy,r,95,0.8,18);inkIt('#fff1d0',2,'rgba(200,130,120,0.5)');
    for(let i=0;i<3;i++){const cw=W+260,cx=((i*cw*0.37+40-time*6-cam*0.03)%cw+cw)%cw-130;cloud(cx,70+i*46,0.9,'#fff4f7');}
  }else skyMore(sk);
}
function drawFlyer(b){
  const f=theme.flyer;
  if(f==='bat')drawBat(b.x,b.y,b.s,b.ph,'rgba(14,8,22,0.85)');
  else if(f==='gull'){ctx.save();ctx.translate(b.x,b.y);ctx.scale(b.s*1.3,b.s*1.3);const w=Math.sin(b.ph)*4;ctx.beginPath();ctx.moveTo(-12,-2+w);ctx.quadraticCurveTo(-6,-7+w*0.5,0,0);ctx.quadraticCurveTo(6,-7+w*0.5,12,-2+w);ctx.strokeStyle='rgba(40,60,90,0.75)';ctx.lineWidth=2.4;ctx.stroke();ctx.restore();}
  else if(f==='comet'){ctx.save();const g=ctx.createLinearGradient(b.x,b.y,b.x+60*b.s,b.y-24*b.s);g.addColorStop(0,'rgba(255,250,220,0.95)');g.addColorStop(1,'rgba(255,250,220,0)');ctx.strokeStyle=g;ctx.lineWidth=3*b.s;ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x+60*b.s,b.y-24*b.s);ctx.stroke();ctx.fillStyle='#fffbe8';ctx.beginPath();ctx.arc(b.x,b.y,2.6*b.s,0,7);ctx.fill();ctx.restore();}
  else flyerMore(f,b);
}
function drawSnowfall(){
  ctx.fillStyle='rgba(255,255,255,0.85)';
  for(let i=0;i<stars.length;i++){const st=stars[i],x=((st.x-time*18*st.s-cam*0.25)%W+W)%W,y=((st.y+time*(26+12*st.s))%H+H)%H;ctx.beginPath();ctx.arc(x+Math.sin(time+st.p)*4,y,st.r*1.1,0,7);ctx.fill();}
}
function drawSea(){
  if(!theme.sea)return;
  ctx.strokeStyle='rgba(255,255,255,0.55)';ctx.lineWidth=2;
  for(let i=0;i<14;i++){const x=((i*97-cam*0.18+Math.sin(time+i)*6)%(W+40)+W+40)%(W+40)-20,y=G-104+(i%4)*9;ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x+8,y-3,x+16,y);ctx.stroke();}
}
function win(x,y,w,h){
  const cx=x+w/2,cy=y+h/2,r=Math.max(w,h)*1.9;
  const g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,'rgba(255,207,107,0.26)');g.addColorStop(1,'rgba(255,207,107,0)');
  ctx.fillStyle=g;ctx.fillRect(cx-r,cy-r,r*2,r*2);
  ctx.fillStyle=C.lit;ctx.fillRect(x,y,w,h);
}
function drawSil(d,pal){
  const sd=d.seed;const sil=()=>inkIt(pal.sil,2,'rgba(10,5,18,0.75)');
  switch(d.type){
    case 'barn':wobPoly([[-38,0],[-38,-44],[-22,-66],[22,-66],[38,-44],[38,0]],sd);sil();win(-6,-56,12,10);break;
    case 'house':wobPoly([[18,-40],[18,-64],[26,-64],[26,-36]],sd+1);sil();wobPoly([[-28,0],[-28,-34],[0,-58],[28,-34],[28,0]],sd);sil();win(-17,-27,9,9);win(8,-27,9,9);break;
    case 'hay':ctx.beginPath();ctx.moveTo(-22,0);ctx.quadraticCurveTo(-24,-30,0,-32);ctx.quadraticCurveTo(24,-30,22,0);ctx.closePath();sil();break;
    case 'tree':ctx.fillStyle=pal.sil;ctx.fillRect(-3,-30,6,30);fluff(0,-44,22,18,8,.2,sd);sil();break;
    case 'windmill':{
      wobPoly([[-12,0],[-7,-72],[7,-72],[12,0]],sd);sil();win(-3,-42,6,8);
      ctx.save();ctx.translate(0,-72);ctx.rotate(time*0.6+sd);
      for(let i=0;i<4;i++){ctx.rotate(Math.PI/2);wobPoly([[-3,4],[-6,42],[6,42],[3,4]],sd+i*9,0.8);sil();}
      ctx.beginPath();ctx.arc(0,0,4,0,7);sil();ctx.restore();break;
    }
    case 'pine':case 'snowpine':{
      const h=90+hash(sd)*50;ctx.fillStyle=pal.sil;ctx.fillRect(-3,-12,6,12);
      for(let i=0;i<3;i++){const y0=-12-i*h*0.27,w=26-i*6;wobPoly([[-w,y0],[0,y0-h*0.42],[w,y0]],sd+i);sil();
        if(d.type==='snowpine'){ctx.strokeStyle='rgba(238,241,251,0.85)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-w*0.45,y0-h*0.24);ctx.lineTo(0,y0-h*0.42);ctx.lineTo(w*0.45,y0-h*0.24);ctx.stroke();}}
      break;
    }
    case 'deadtree':{
      ctx.strokeStyle=pal.sil;ctx.lineCap='round';
      ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(-4,-40,4,-78);ctx.stroke();
      ctx.lineWidth=4;
      for(let i=0;i<4;i++){const y=-30-i*13,sd2=hash(sd+i)>0.5?1:-1,l=18+hash(sd+i*3)*18;ctx.beginPath();ctx.moveTo(0,y);ctx.quadraticCurveTo(sd2*l*0.6,y-6,sd2*l,y-16-hash(sd+i*7)*10);ctx.stroke();}
      break;
    }
    case 'church':{
      wobPoly([[-34,0],[-34,-34],[-10,-50],[0,-34],[0,0]],sd);sil();
      wobPoly([[0,0],[0,-64],[18,-64],[18,0]],sd+2);sil();
      wobPoly([[-3,-64],[9,-96],[21,-64]],sd+3);sil();
      ctx.strokeStyle=pal.sil;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(9,-96);ctx.lineTo(9,-110);ctx.moveTo(4,-105);ctx.lineTo(14,-105);ctx.stroke();
      ctx.fillStyle=C.lit;ctx.beginPath();ctx.arc(9,-48,4.5,0,7);ctx.fill();win(-22,-28,7,10);break;
    }
    case 'crosses':
      ctx.strokeStyle=pal.sil;ctx.lineWidth=4;
      for(const [x,h] of [[-24,26],[0,34],[22,22]]){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,-h);ctx.moveTo(x-7,-h+8);ctx.lineTo(x+7,-h+8);ctx.stroke();}
      break;
    case 'palm':{
      ctx.strokeStyle=C.ink;ctx.lineWidth=11;ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(-6,-50,10,-92);ctx.stroke();ctx.strokeStyle=pal.sil;ctx.lineWidth=7;ctx.stroke();
      ctx.save();ctx.translate(10,-92);for(let i=0;i<6;i++){ctx.save();ctx.rotate(-Math.PI+i*Math.PI/5+Math.sin(time*1.5+i)*0.05);ctx.beginPath();ctx.ellipse(22,0,24,6,0.25,0,7);sil();ctx.restore();}
      ctx.fillStyle='#6b4a2a';for(const [cx2,cy2] of [[-3,4],[4,5]]){ctx.beginPath();ctx.arc(cx2,cy2,3.5,0,7);ctx.fill();}ctx.restore();break;}
    case 'hut':
      wobPoly([[-22,0],[-22,-34],[22,-34],[22,0]],sd);sil();
      ctx.fillStyle='rgba(255,255,255,0.45)';for(let i=0;i<4;i++)ctx.fillRect(-20+i*11,-33,5,32);
      wobPoly([[-27,-32],[0,-50],[27,-32]],sd+1);sil();break;
    case 'lighthouse':
      wobPoly([[-14,0],[-9,-96],[9,-96],[14,0]],sd);sil();
      ctx.fillStyle='rgba(255,255,255,0.5)';for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(-13+i*1.6,-12-i*30);ctx.lineTo(13-i*1.6,-12-i*30);ctx.lineTo(12.5-i*1.6,-24-i*30);ctx.lineTo(-12.5+i*1.6,-24-i*30);ctx.closePath();ctx.fill();}
      wobPoly([[-11,-96],[-11,-110],[11,-110],[11,-96]],sd+2,0.5);inkIt('#fff2b0',2);
      wobPoly([[-14,-110],[0,-122],[14,-110]],sd+3);sil();break;
    case 'parasolBg':
      ctx.strokeStyle=pal.sil;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-44);ctx.stroke();
      ctx.beginPath();ctx.moveTo(-28,-40);ctx.quadraticCurveTo(0,-66,28,-40);ctx.closePath();sil();break;
    case 'dish':
      wobPoly([[-6,0],[-4,-30],[4,-30],[6,0]],sd);sil();
      ctx.save();ctx.translate(0,-36);ctx.rotate(-0.5+Math.sin(time*0.4+sd)*0.2);ctx.beginPath();ctx.ellipse(0,0,26,10,0,0,Math.PI);ctx.closePath();sil();
      ctx.strokeStyle=pal.sil;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-16);ctx.stroke();ctx.restore();break;
    case 'rocket':
      ctx.beginPath();ctx.moveTo(0,-90);ctx.quadraticCurveTo(14,-70,12,-20);ctx.lineTo(-12,-20);ctx.quadraticCurveTo(-14,-70,0,-90);ctx.closePath();sil();
      wobPoly([[-12,-30],[-22,0],[-10,-20]],sd,0.5);sil();wobPoly([[12,-30],[22,0],[10,-20]],sd+1,0.5);sil();
      ctx.fillStyle='#9fd0ff';ctx.beginPath();ctx.arc(0,-58,5,0,7);ctx.fill();break;
    case 'dome':
      ctx.beginPath();ctx.moveTo(-34,0);ctx.arc(0,0,34,Math.PI,0);ctx.closePath();sil();
      ctx.strokeStyle='rgba(160,200,255,0.35)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,0,24,Math.PI,0);ctx.moveTo(0,-34);ctx.lineTo(0,0);ctx.stroke();
      win(-16,-14,8,8);win(8,-14,8,8);break;
    case 'crystal':
      for(const [cx2,h,a] of [[-8,40,-0.2],[4,58,0.05],[14,30,0.3]]){ctx.save();ctx.translate(cx2,0);ctx.rotate(a);ctx.beginPath();ctx.moveTo(-6,0);ctx.lineTo(-5,-h*0.8);ctx.lineTo(0,-h);ctx.lineTo(5,-h*0.8);ctx.lineTo(6,0);ctx.closePath();sil();ctx.restore();}
      break;
    case 'skilift':
      ctx.strokeStyle=pal.sil;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-100);ctx.moveTo(-14,-96);ctx.lineTo(14,-96);ctx.stroke();
      ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(-140,-80);ctx.lineTo(0,-98);ctx.lineTo(140,-118);ctx.stroke();
      for(const cx2 of [-70,60]){const cy2=cx2<0?-89:-107;ctx.save();ctx.translate(cx2,cy2);ctx.rotate(Math.sin(time*1.4+cx2)*0.08);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,18);ctx.stroke();wobPoly([[-10,18],[10,18],[10,24],[-10,24]],cx2,0.4);sil();ctx.restore();}
      break;
    case 'cabin':
      wobPoly([[-24,0],[-24,-26],[24,-26],[24,0]],sd);sil();
      wobPoly([[-30,-24],[0,-48],[30,-24]],sd+1);sil();
      ctx.strokeStyle='rgba(238,241,251,0.9)';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-28,-26);ctx.lineTo(0,-47);ctx.lineTo(28,-26);ctx.stroke();
      win(-8,-19,10,9);break;
    default:silMore(d,pal,sil,sd);
  }
}
function drawMid(pal){
  const off=cam*0.35,amp=34*(1+0.8*pal.peak);
  for(const d of decorMid){
    const x=d.x-off;if(x<-120||x>W+120)continue;
    ctx.save();ctx.translate(x,ridgeY(d.x,G-40,amp,7.7,pal.peak)+8);ctx.scale(d.s,d.s);ctx.lineJoin='round';drawSil(d,pal);ctx.restore();
  }
  drawRidge(0.35,G-40,amp,7.7,pal.peak,pal.mid,pal.snow*0.6);
}
function drawGround(pal){
  const step=18,off=((cam%step)+step)%step;
  ctx.beginPath();ctx.moveTo(-20,H+20);
  for(let x=-off-step;x<=W+step*2;x+=step){const i=Math.round((x+cam)/step);ctx.lineTo(x,G-3+Math.sin(i*0.9)*1.6+(hash(i)-0.5)*2.4);}
  ctx.lineTo(W+40,H+20);ctx.closePath();
  ctx.fillStyle=pal.ground;ctx.fill();
  ctx.strokeStyle=pal.grass;ctx.lineWidth=7;ctx.stroke();
  ctx.strokeStyle=C.ink;ctx.lineWidth=2.6;ctx.stroke();
  ctx.strokeStyle='rgba(10,5,18,0.18)';ctx.lineWidth=2;
  const s2=46,off2=((cam%s2)+s2)%s2;
  for(let x=-off2;x<W+s2;x+=s2){const i=Math.round((x+cam)/s2);ctx.beginPath();ctx.moveTo(x+hash(i)*20,G+18+hash(i*3)*30);ctx.lineTo(x+hash(i)*20+14+hash(i*5)*16,G+18+hash(i*3)*30+(hash(i*7)-0.5)*4);ctx.stroke();}
}
function drawNear(pal){
  for(const d of decorNear){

    ctx.save();ctx.translate(x,G+1);ctx.scale(d.s,d.s);ctx.lineJoin='round';ctx.lineCap='round';
    const sd=d.seed;
    switch(d.type){
      case 'fence':
        for(const ry of [-26,-13]){wobPoly([[-4,ry-3],[92,ry-3],[92,ry+3],[-4,ry+3]],sd+ry,0.8);inkIt('#4f3627',2);}
        for(const px of [0,44,88]){wobPoly([[px-4,0],[px-4,-34],[px,-38],[px+4,-34],[px+4,0]],sd+px,0.8);inkIt('#654531',2);}
        break;
      case 'pumpkin':
        ctx.beginPath();ctx.ellipse(0,-10,14,10.5,0,0,7);inkIt('#cf6420',2.2);
        ctx.strokeStyle='rgba(90,30,10,0.55)';ctx.lineWidth=1.6;ctx.beginPath();ctx.ellipse(0,-10,5,10,0,0,7);ctx.stroke();
        wobPoly([[-2,-19],[-1,-26],[3,-25],[2,-19]],sd,0.5);inkIt('#4d5a2a',1.6);
        ctx.fillStyle='#ffd36b';
        ctx.beginPath();ctx.moveTo(-8,-12);ctx.lineTo(-4,-12);ctx.lineTo(-6,-16);ctx.fill();
        ctx.beginPath();ctx.moveTo(4,-12);ctx.lineTo(8,-12);ctx.lineTo(6,-16);ctx.fill();
        ctx.beginPath();ctx.moveTo(-8,-7);ctx.lineTo(-4,-4);ctx.lineTo(0,-7);ctx.lineTo(4,-4);ctx.lineTo(8,-7);ctx.lineTo(0,-2);ctx.closePath();ctx.fill();
        break;
      case 'tuft':
        ctx.strokeStyle=pal.grass;ctx.lineWidth=2.2;
        for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(i*3,0);ctx.quadraticCurveTo(i*4,-6,i*5+Math.sin(time*2+sd+i)*1.5,-9-hash(sd+i)*7);ctx.stroke();}

function buyUpgrade(u){
  const l=up(u.id);if(l>=3){castleSay(upName(u)+' is fully built');return;}
  const cost=u.cost[l],need=u.sheep[l];
  if(save.sheep<need){castleSay('Steal '+(need-save.sheep)+' more sheep first',u.id);sfx.bonk();return;}
  if(save.blood<cost){castleSay('You need '+(cost-save.blood)+' more '+theme.item.short,u.id);sfx.bonk();return;}
  save.blood-=cost;save.up[u.id]=l+1;persist();sfx.power();
  castleSay(upName(u)+(l===0?' built!':' upgraded!'));castleBurst();
  const got=checkUnlocks();if(got.length)castleSay(got.join(', ')+' Sheepula unlocked!');
}
function pickSkin(sk){
  if(owns(sk.id)){if(save.skin!==sk.id){save.skin=sk.id;persist();applyTheme();sfx.click();}castleSay(sk.name+' Sheepula is ready');return;}
  if(sk.how==='blood'){
    if(save.blood<sk.cost){castleSay('You need '+(sk.cost-save.blood)+' more '+theme.item.short,sk.id);sfx.bonk();return;}
    save.blood-=sk.cost;save.skins.push(sk.id);save.skin=sk.id;persist();applyTheme();sfx.power();castleSay(sk.name+' Sheepula is yours!');castleBurst();return;
  }
  let msg=sk.label;
  if(sk.prog){const [c,t]=sk.prog();msg+=': '+Math.min(c,t).toLocaleString('en-US')+' / '+t.toLocaleString('en-US');}
  else if(sk.how==='season')msg=season()===sk.season?sk.label+' is on! Fly one run to unlock':sk.label+', comes back every year';
  else if(sk.how==='boss')msg=sk.label+' (shows up at '+sk.where+')';
  else if(sk.how==='chest')msg='Only found in rare chests';
  castleSay(msg,sk.id);sfx.bonk();
}
function openChest(){
  if(chestAnim&&chestAnim.t<1.1)return;
  if(save.chests<=0){castleSay('No chests yet. Find them in the sky or beat a boss');sfx.bonk();return;}
  save.chests--;
  const pool=SKINS.filter(sk=>sk.how==='chest'&&!owns(sk.id));let reward;
  if(pool.length&&(save.chestPity>=2||Math.random()<0.35)){const sk=pick(pool);save.skins.push(sk.id);save.chestPity=0;reward={kind:'skin',id:sk.id,name:sk.name};}
  else{const n=randi(40,110);save.blood+=n;save.chestPity++;reward={kind:'blood',n};}
  persist();chestAnim={t:0,reward,px:null,py:null};sfx.click();
}

  drawRidge(0.12,G-110,pal.amp,2.1,pal.peak,pal.far,pal.snow);
  drawSea();
  for(const b of bats)drawFlyer(b);
  drawMid(pal);
  const fog=ctx.createLinearGradient(0,G-90,0,G);fog.addColorStop(0,'rgba(255,255,255,0)');fog.addColorStop(1,theme.fog);
  ctx.fillStyle=fog;ctx.fillRect(-20,G-90,W+40,90);
  drawGround(pal);
  drawNear(pal);
  drawCliff();
  drawEntities();
  drawSpot();
  drawPlayer();
  drawFinishFront();
  drawParts();
  drawWarnings();
  drawIncoming();
  if(theme.snowfall)drawSnowfall();
  ctx.restore();
  ctx.globalAlpha=theme.vig;ctx.fillStyle=vignette;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;
  if(P.pw.vampire>0&&(state==='playing'||state==='dying')){
    const a=(0.1+0.05*Math.sin(time*6))*Math.min(1,P.pw.vampire);
    const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.3,W/2,H/2,Math.max(W,H)*0.75);vg.addColorStop(0,'rgba(150,0,30,0)');vg.addColorStop(1,`rgba(170,0,35,${a*3})`);
    ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);ctx.fillStyle=`rgba(120,0,25,${a})`;ctx.fillRect(0,0,W,H);
  }
  ctx.save();ctx.globalAlpha=0.55;ctx.fillStyle=grainPat;ctx.fillRect(0,0,W,H);ctx.restore();
  uiW={px:PX,py:P.y};
  ui(()=>{
    if(state==='menu')drawMenu();
    else if(state==='missions')drawMissionsScreen();
    else if(state==='story')drawStoryMap();
    else if(state==='cutscene')drawCutscene();
    else if(state==='playing'||state==='dying'||state==='paused'||state==='resuming'||state==='finishing'||state==='ready')drawHUD();
    if(state==='paused')drawPaused();
    if(state==='resuming')drawResuming();
    if(state==='over')drawOver();
  });
  if(state==='over'&&run.rankFx)drawParts();
  if(flash>0){ctx.globalAlpha=flash*0.45;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  drawFade();
}
let last=performance.now();
function frame(now){
  let dt=(now-last)/1000;last=now;
  if(!(dt>0))dt=0;if(dt>0.05)dt=0.05;
  const n=Math.max(1,Math.ceil(dt/(1/120))),h=dt/n;
  for(let i=0;i<n;i++)update(h);
  cleanup();draw();
  requestAnimationFrame(frame);
}

/* ================= Input ================= */
function toVirtual(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/S,y:(e.clientY-r.top)/S};}
function press(x,y){
  for(let i=buttons.length-1;i>=0;i--){const b=buttons[i];if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){b.act();return;}}
  if(state==='menu')startRun();
  else if(state==='ready')go();
  else if(state==='playing')flap();
  else if(state==='paused')resume();
  else if(state==='over'&&stateT>0.6)overPrimary();
  else if(state==='cutscene')cutNext();
  else if(state==='finishing')skipFinish();
}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();try{cv.focus({preventScroll:true});}catch(_){}
  unlockAudio();const p=toVirtual(e);pointer=p;pointerIdle=0;press(p.x,p.y);
});
cv.addEventListener('pointermove',e=>{pointer=toVirtual(e);pointerIdle=0;});
cv.addEventListener('pointerleave',()=>{pointer={x:-999,y:-999};});
cv.addEventListener('contextmenu',e=>e.preventDefault());
/* the studio link opens on click (a real user gesture everywhere, also iOS); only on the start screen */
cv.addEventListener('click',e=>{if(state!=='menu'||!siteLink)return;const p=toVirtual(e),b=siteLink;if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){sfx.click();try{window.open('https://'+SITE,'_blank','noopener');}catch(_){}}});
/* iOS only resumes audio inside touchend/click, not pointerdown */
cv.addEventListener('touchend',()=>unlockAudio(),{passive:true});
document.addEventListener('click',()=>unlockAudio());
window.addEventListener('keydown',e=>{
  const k=e.code;
  if(k==='Space'||k==='ArrowUp'||k==='KeyW'||k==='Enter'||k==='NumpadEnter'){
    e.preventDefault();if(e.repeat)return;unlockAudio();pointerIdle=0;
    if(state==='menu')startRun();else if(state==='ready')go();else if(state==='playing')flap();else if(state==='paused')resume();else if(state==='over'&&stateT>0.5)overPrimary();else if(state==='castle'||state==='missions')restart();else if(state==='cutscene')cutNext();else if(state==='finishing')skipFinish();else if(state==='story'&&storySel)startLevel(storySel);
  }else if(k==='KeyP'||k==='Escape'){if(state==='playing')pause();else if(state==='paused')resume();else if(state==='castle'&&k==='Escape')goMenu();else if(state==='missions')closeMissions();else if(state==='story')goMenu();else if(state==='cutscene')finishCut();}
  else if((k==='ArrowLeft'||k==='ArrowRight')&&state==='story')switchChapter(k==='ArrowLeft'?-1:1);
  else if(k==='KeyS'||k==='KeyX'||k==='ShiftLeft'||k==='ShiftRight'){if(!e.repeat)doScream();}
  else if(k==='KeyM')toggleMute();
  else if(k==='KeyC'){if(state==='menu'||(state==='over'&&stateT>0.5))openCastle();}
  else if(k==='KeyK'){if(state==='menu'||(state==='over'&&stateT>0.5))openWardrobe();}
  else if((k==='ArrowLeft'||k==='ArrowRight')&&state==='castle'&&castleTab==='skins'){const i=SKINS.findIndex(sk=>sk.id===previewId),d=k==='ArrowLeft'?-1:1;setPreview(SKINS[(i+d+SKINS.length)%SKINS.length].id);}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
window.addEventListener('resize',resize);
try{new ResizeObserver(()=>resize()).observe(cv);}catch(e){}

/* ================= Boot ================= */
resize();resetWorld();
if(!save.tutDone&&!save.runs)startRun();
requestAnimationFrame(t=>{last=t;requestAnimationFrame(frame);});

/* Test hooks for automated play-testing (harmless in normal play) */
function autopilot(){
  if(state!=='playing')return;
  let target=(PT()+PB())/2;
  for(const e of ents){if(e.type==='stake'&&e.wx+e.w>cam+PX-20){target=e.gy;break;}}
  if(P.y>target+10&&P.vy>-60)flap();
}
if(location.protocol==='file:')window.__sheepula={
  get state(){return state;},get cam(){return cam;},get score(){return score();},get run(){return run;},stats,
  set god(v){godMode=!!v;},start(){if(state==='menu')startRun();else restart();},flap,scream:doScream,pause,resume,
  sim(seconds,auto=true){for(let i=0;i<seconds*60;i++){if(auto)autopilot();update(1/60);cleanup();}return {state,cam:Math.round(cam),score:score(),blood:run.blood,sheep:run.sheep};},
  give(k){P.pw[k]=pwDur(k);},charge(){P.screamN=screamCost();},get screamN(){return P.screamN;},
  get G(){return G;},get dbg(){return {S,W,H,state,btn:buttons.map(b=>[Math.round(b.x),Math.round(b.y),Math.round(b.w),Math.round(b.h)])};},get py(){return P.y;},
  castle(){openCastle();},tab(t){castleTab=t;},rich(b,sh){save.blood+=b;save.sheep+=sh;persist();},buy(id){buyUpgrade(UPGRADES.find(u=>u.id===id));},
  wear(id){pickSkin(SKINS.find(x=>x.id===id));},get save(){return save;},
  own(id){unlockSkin(id);},ownAll(){for(const sk of SKINS)unlockSkin(sk.id);},page(n){castlePage=n;},addChests(n){save.chests+=n;persist();},openChest(){openChest();},
  lineup(ids,cols,sc,flying){lineupSpec=ids?{ids,cols,sc,flying}:null;},
  setTheme(id){theme=THEMES[id];},get themeId(){return theme.id;},tryRun(id){tryRun(id);},
  boss(){gen.nextBoss=gen.x;},fboss(){gen.bossN=1;gen.nextBoss=gen.x;},get fbInfo(){const b=ents.find(e=>e.type==='fboss');return b?{state:b.state,hp:b.hp,sx:Math.round(b.sx),n:b.n,t:+b.t.toFixed(2)}:null;},wardrobe(){openWardrobe();},preview(id){setPreview(id);},stageAt(t){stageT=t;},flyPose(v){stageFly=!!v;},get bossInfo(){const b=ents.find(e=>e.type==='boss');return b?{state:b.state,hp:b.hp,sx:Math.round(b.sx),y:Math.round(b.y)}:null;},
  spawn(t,dx){spawnEnemy(t,cam+PX+(dx||W*0.8),0.6);},
  spawnType(t,dx){spawnEnemy(t,cam+PX+(dx||W*0.8),0.7);},

};
})();
