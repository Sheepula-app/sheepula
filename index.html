<style>
/* Layout: one full-bleed canvas. HUD, menus and panels are drawn inside it; a single night look by design. */

  --night:#1a1230;
  --ink:#150c1e;
  --wool:#f5e9da;

<canvas id="game" tabindex="0" aria-label="Sheepula. Tap, click or press Space to flap. S to scream, P to pause, M to mute."></canvas>
<div class="fontwarm" aria-hidden="true"><span>Sheepula</span><span>Score</span></div>
<script>
(() => {
'use strict';

/* ================= Tunables (balance lives here) ================= */

  flapVel: -440,        // upward impulse per tap
  maxFall: 640,
  speedStart: 175,      // forward speed at start

  gapStart: 240,        // stake gap at start
  gapMin: 175,          // stake gap at full difficulty

  screamCost: 24,       // blood drops to charge the Vampire Scream
  powerChance: 0.4,     // chance of a power-up in a free-flight section

const FONT_HAND = "'Patrick Hand','Comic Sans MS','Chalkboard SE',cursive";
const FONT_DISP = "'Creepster','Chiller',fantasy";

const disp = s => `${s}px ${FONT_DISP}`;

const C = {

  pink:'#eb9fb0', gold:'#e8b84f', moon:'#f8eab0', warn:'#ffd23f', shield:'#7fb2ff',
  wood:'#8b5a33', woodTip:'#e2b981', lit:'#ffcf6b', skin:'#eab38d', overall:'#3f5c9c', hat:'#d8b15a',
  panel:'#241a3a', dim:'#cdbfdc'
};

const WORLDS = [
  { name:'The Farm', top:'#1a1535', bot:'#5b3c78', far:'#3c2b60', mid:'#2a1e46', sil:'#1d1433', ground:'#2b1e34', grass:'#55663f', amp:40, peak:0, snow:0,

  { name:'The Forest', top:'#0f1a2c', bot:'#3a4170', far:'#26345a', mid:'#18233d', sil:'#0f1628', ground:'#1d2129', grass:'#33503e', amp:55, peak:0.15, snow:0,
    decor:['pine','pine','deadtree','pine','tree'], near:['bush','tuft','mushroom','stump','bush'] },
  { name:'The Graveyard', top:'#181327', bot:'#4c3a68', far:'#362c52', mid:'#231c37', sil:'#150f24', ground:'#262033', grass:'#46405a', amp:32, peak:0, snow:0,
    decor:['church','deadtree','crosses','deadtree','crosses'], near:['grave','grave','cross','tuft','pumpkin'] },
  { name:'The Mountains', top:'#132042', bot:'#5d6ea2', far:'#4b5b8a', mid:'#2c3662', sil:'#1a2245', ground:'#c9cee6', grass:'#f3f5fc', amp:140, peak:1, snow:1,
    decor:['snowpine','snowpine','cabin','snowpine'], near:['rock','snowtuft','snowpine','rock'] },
];

const QUIPS = [
  'And stay away from my sheep!',
  "That's the third sheep this week!",
  'Martha! Fetch the big pitchfork!',
  'Vampire sheep? In THIS economy?',
  'Garlic! Somebody get the garlic!',
  'Go back to your spooky castle!',
];
const MENU_LINES = ['Blood... I need blood.','Fear me, farmers!','Bleh! Bleh-bleh!','Tonight, we feast.','I am the night. Baa.'];

/* ================= Helpers ================= */
const rand=(a,b)=>a+Math.random()*(b-a);
const randi=(a,b)=>Math.floor(a+Math.random()*(b-a+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=t=>t*t*(3-2*t);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const hash=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);};
const damp=(a,b,k,dt)=>lerp(a,b,1-Math.exp(-k*dt));
const hit=(ax,ay,ar,bx,by,br)=>{const dx=ax-bx,dy=ay-by,r=ar+br;return dx*dx+dy*dy<r*r;};
function circRect(cx,cy,r,x0,y0,x1,y1){const nx=clamp(cx,x0,x1),ny=clamp(cy,y0,y1),dx=cx-nx,dy=cy-ny;return dx*dx+dy*dy<r*r;}
const _rgb={};
function rgbOf(h){return _rgb[h]||(_rgb[h]=[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]);}
function mix(a,b,t){const A=rgbOf(a),B=rgbOf(b);return `rgb(${Math.round(A[0]+(B[0]-A[0])*t)},${Math.round(A[1]+(B[1]-A[1])*t)},${Math.round(A[2]+(B[2]-A[2])*t)})`;}

/* ================= Save data ================= */
const SAVE_KEY='sheepula.save.v1';
const save={best:0,blood:0,sheep:0,runs:0,muted:false,up:{},skins:['classic'],skin:'classic'};
try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(s&&typeof s==='object')Object.assign(save,s);}catch(e){}
const persist=()=>{try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}};

/* ================= Castle progression (blood is spent, sheep live in your pen) ================= */
const UPGRADES=[
  {id:'cellar',name:'Blood Cellar',cost:[30,90,220],sheep:[0,2,6],desc:['Scream needs 20 drops','Scream needs 16 drops','Scream needs 12 drops']},
  {id:'pen',name:'Sheep Pen',cost:[40,110,260],sheep:[1,4,10],desc:['Grab sheep from afar, +2 blood','Longer reach, +4 blood','Longest reach, +6 blood']},
  {id:'tower',name:'Vampire Tower',cost:[50,140,300],sheep:[0,3,8],desc:['Power-ups last 25% longer','Power-ups last 50% longer','Power-ups last 75% longer']},
  {id:'library',name:'Library',cost:[60,150,320],sheep:[0,3,8],desc:['More power-ups','Even more power-ups','Start each run shielded']},
  {id:'throne',name:'Throne Room',cost:[200,400,700],sheep:[5,12,20],desc:['Survive one crash per run','Start with half a Scream','All scores +25%']},
];
const SKINS=[
  {id:'classic',name:'Classic',how:'free'},
  {id:'zombie',name:'Zombie',how:'blood',cost:80},
  {id:'pirate',name:'Pirate',how:'blood',cost:150},
  {id:'beach',name:'Beach',how:'blood',cost:200},
  {id:'wizard',name:'Wizard',how:'blood',cost:260},
  {id:'devil',name:'Devil',how:'blood',cost:320},
  {id:'cyber',name:'Cyber',how:'feat',label:'Score 2,500',prog:()=>[save.best,2500]},
  {id:'rainbow',name:'Rainbow',how:'feat',label:'40 drops in a run',prog:()=>[save.stats.bestBlood,40]},
  {id:'ninja',name:'Ninja',how:'feat',label:'Fly 5,000 m',prog:()=>[Math.floor(save.stats.meters),5000]},
  {id:'king',name:'King',how:'challenge',label:'Steal 100 sheep',prog:()=>[save.sheep,100]},
  {id:'sleepy',name:'Sleepy',how:'challenge',rare:true,label:'Play 25 runs',prog:()=>[save.runs,25]},
  {id:'alien',name:'Alien',how:'challenge',rare:true,label:'Scream 15 times',prog:()=>[save.stats.screams,15]},
  {id:'golden',name:'Royal Golden',how:'challenge',rare:true,label:'Build all 5 rooms',prog:()=>[UPGRADES.filter(u=>up(u.id)>0).length,5]},
  {id:'santa',name:'Santa',how:'season',season:'christmas',label:'December event'},
  {id:'ghost',name:'Ghost',how:'season',season:'halloween',label:'Halloween event'},
  {id:'count',name:'Count',how:'boss',rare:true,label:'Beat Mother Hen'},
  {id:'disco',name:'Disco',how:'chest',rare:true,label:'Rare chests'},
  {id:'business',name:'Business',how:'chest',rare:true,label:'Rare chests'},
  {id:'pghost',name:'Pirate Ghost',how:'chest',rare:true,label:'Rare chests'},
];
if(!save.up||typeof save.up!=='object')save.up={};
for(const u of UPGRADES)save.up[u.id]=clamp(Math.floor(+save.up[u.id]||0),0,3);
if(!Array.isArray(save.skins))save.skins=['classic'];
save.skins=save.skins.filter(id=>SKINS.some(sk=>sk.id===id));
if(!save.skins.includes('classic'))save.skins.push('classic');
if(!save.stats||typeof save.stats!=='object')save.stats={};
for(const k of ['meters','screams','bestBlood','bosses','chestsFound'])save.stats[k]=+save.stats[k]||0;
save.chests=Math.max(0,Math.floor(+save.chests||0));save.chestPity=+save.chestPity||0;
const up=k=>save.up[k]||0;
const owns=id=>save.skins.includes(id);
if(!owns(save.skin))save.skin='classic';
const screamCost=()=>CONFIG.screamCost-4*up('cellar');
const pwDur=k=>CONFIG.pw[k]*(1+0.25*up('tower'));
const powerChance=()=>CONFIG.powerChance+0.15*Math.min(2,up('library'));
function canBuy(u){const l=up(u.id);return l<3&&save.blood>=u.cost[l]&&save.sheep>=u.sheep[l];}
function season(){const d=new Date(),m=d.getMonth()+1,day=d.getDate();if((m===10&&day>=15)||(m===11&&day<=7))return 'halloween';if(m===12)return 'christmas';return null;}
function unlockSkin(id){if(owns(id))return false;save.skins.push(id);persist();return true;}
function checkUnlocks(){const got=[];for(const sk of SKINS){if(owns(sk.id)||!sk.prog)continue;const [c,t]=sk.prog();if(c>=t){save.skins.push(sk.id);got.push(sk.name);}}if(got.length)persist();return got;}
const anyAffordable=()=>UPGRADES.some(canBuy)||SKINS.some(sk=>sk.how==='blood'&&!owns(sk.id)&&save.blood>=sk.cost)||save.chests>0;

/* ================= Canvas ================= */
const cv=document.getElementById('game');
const ctx=cv.getContext('2d');
let W=360,H=640,S=1,DPR=1,G=574,PX=94;
let vignette=null,grainPat=null,stars=[];
const isTouch=(()=>{try{return matchMedia('(pointer: coarse)').matches;}catch(e){return false;}})();

function resize(){
  const r=cv.getBoundingClientRect();
  const cw=Math.max(1,r.width),ch=Math.max(1,r.height);
  DPR=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(cw*DPR);cv.height=Math.round(ch*DPR);
  S=Math.min(ch/640,cw/360);
  W=cw/S;H=ch/S;G=H-66;PX=clamp(W*0.26,92,250);
  buildStatic();
  if(state==='playing')pause();
}
function buildStatic(){
  vignette=ctx.createRadialGradient(W/2,H*0.45,Math.min(W,H)*0.32,W/2,H*0.5,Math.max(W,H)*0.82);
  vignette.addColorStop(0,'rgba(8,2,18,0)');vignette.addColorStop(1,'rgba(8,2,18,0.6)');
  stars=[];const n=Math.round(W*H/5000);
  for(let i=0;i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*G*0.7,r:rand(0.6,1.8),p:Math.random()*6.28,s:rand(1,3)});
  if(!grainPat){
    const g=document.createElement('canvas');g.width=g.height=128;const gx=g.getContext('2d');
    const id=gx.createImageData(128,128);
    for(let i=0;i<id.data.length;i+=4){const v=Math.random()*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=Math.random()<0.55?0:34;}
    gx.putImageData(id,0,0);grainPat=ctx.createPattern(g,'repeat');
  }
}

/* ================= Audio (all synthesized) ================= */
let AC=null,master=null,sfxBus=null,musBus=null,noiseBuf=null,musicTimer=null,nextNote=0,musicStep=0;
function unlockAudio(){
  if(AC){if(AC.state==='suspended')AC.resume().catch(()=>{});return;}
  const Ctor=window.AudioContext||window.webkitAudioContext;if(!Ctor)return;
  try{
    AC=new Ctor();
    master=AC.createGain();master.gain.value=save.muted?0:1;master.connect(AC.destination);
    sfxBus=AC.createGain();sfxBus.gain.value=0.55;sfxBus.connect(master);
    musBus=AC.createGain();musBus.gain.value=0.22;musBus.connect(master);
    noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
    const ch=noiseBuf.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;
    startMusic();
  }catch(e){AC=null;}
}
function env(g,t,vol,a,dur){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(vol,0.0002),t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);}
function tone(f,dur,{type='sine',f2=0,vol=0.2,when=0,a=0.005,bus=null,lp=0}={}){
  if(!AC)return;const t=AC.currentTime+when;const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  env(g,t,vol,a,dur);let node=o;
  if(lp){const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=lp;o.connect(fl);node=fl;}
  node.connect(g);g.connect(bus||sfxBus);o.start(t);o.stop(t+dur+0.05);
}
function noise(dur,{vol=0.2,f=1000,f2=0,q=1,type='bandpass',when=0,a=0.005}={}){
  if(!AC)return;const t=AC.currentTime+when;const s=AC.createBufferSource();s.buffer=noiseBuf;
  const fl=AC.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+dur);fl.Q.value=q;
  const g=AC.createGain();env(g,t,vol,a,dur);s.connect(fl);fl.connect(g);g.connect(sfxBus);s.start(t,Math.random()*0.4);s.stop(t+dur+0.05);
}
const sfx={
  flap(){noise(.12,{vol:.16,f:900,f2:350,q:.8});tone(240,.08,{f2:380,vol:.04});},
  drop(n){const p=Math.pow(2,Math.min(n,12)/12);tone(880*p,.12,{type:'triangle',f2:1320*p,vol:.12});tone(1760*p,.07,{vol:.04,when:.04});},
  baa(){
    if(!AC)return;const t=AC.currentTime;const o=AC.createOscillator();o.type='sawtooth';
    o.frequency.setValueAtTime(330,t);o.frequency.linearRampToValueAtTime(290,t+.45);
    const lfo=AC.createOscillator();lfo.frequency.value=17;const lg=AC.createGain();lg.gain.value=26;lfo.connect(lg);lg.connect(o.frequency);
    const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=1150;f.Q.value=2.5;const g=AC.createGain();env(g,t,.4,.03,.5);
    o.connect(f);f.connect(g);g.connect(sfxBus);o.start(t);lfo.start(t);o.stop(t+.56);lfo.stop(t+.56);
  },
  power(){[523,659,784,1047].forEach((f,i)=>tone(f,.14,{type:'triangle',vol:.12,when:i*.06}));},
  hit(){noise(.35,{vol:.5,f:500,f2:120,type:'lowpass'});tone(260,.45,{type:'square',f2:60,vol:.09,lp:1200});},
  thud(){noise(.15,{vol:.3,f:300,type:'lowpass'});},
  bonk(){tone(320,.12,{type:'square',f2:140,vol:.08,lp:1500});noise(.08,{vol:.15,f:2000});},
  clank(){tone(1400,.12,{type:'triangle',f2:900,vol:.08});noise(.06,{vol:.1,f:4000});},
  warn(){tone(880,.07,{type:'square',vol:.05,lp:3000});tone(880,.07,{type:'square',vol:.05,lp:3000,when:.12});},
  cluck(){[0,.07,.14].forEach(w=>tone(rand(560,700),.05,{type:'square',f2:400,vol:.04,lp:2500,when:w}));},
  crow(){tone(520,.45,{type:'sawtooth',f2:950,vol:.06,lp:2200});},
  throw(){noise(.25,{vol:.12,f:1500,f2:600,q:.7});},
  growl(){tone(150,.45,{type:'sawtooth',f2:95,vol:.09,lp:900});tone(155,.45,{type:'sawtooth',f2:92,vol:.06,lp:700,when:.03});},
  lock(){tone(1250,.06,{type:'square',vol:.05,lp:4000});tone(1250,.06,{type:'square',vol:.05,lp:4000,when:.09});},
  whoosh(){noise(.3,{vol:.3,f:3200,f2:700,q:.9});tone(900,.2,{type:'triangle',f2:300,vol:.05});},
  plop(){tone(300,.08,{f2:180,vol:.08});},
  splat(){noise(.12,{vol:.1,f:400,type:'lowpass'});},
  scream(){tone(720,.8,{type:'sawtooth',f2:120,vol:.12,lp:2400});tone(735,.8,{type:'sawtooth',f2:118,vol:.1,lp:2400});noise(.6,{vol:.2,f:1600,f2:500,q:.6});},
  ready(){tone(660,.1,{type:'triangle',vol:.1});tone(990,.16,{type:'triangle',vol:.1,when:.09});},
  best(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.18,{type:'triangle',vol:.12,when:i*.08}));},
  over(){[392,330,262,196].forEach((f,i)=>tone(f,.25,{type:'triangle',vol:.1,when:i*.14}));},
  click(){tone(600,.05,{type:'triangle',vol:.06});},
};
const NOTE={C:-9,'C#':-8,D:-7,'D#':-6,E:-5,F:-4,'F#':-3,G:-2,'G#':-1,A:0,'A#':1,B:2};
const nf=n=>{const m=n.match(/^([A-G]#?)(\d)$/);return 440*Math.pow(2,(NOTE[m[1]]+(+m[2]-4)*12)/12);};
const BASS=['D2',0,'A2',0,'D3',0,'A2',0,'A#1',0,'F2',0,'A1',0,'C#2','E2'];
const MEL1=['D5',0,'F5',0,'A5',0,'G#5',0,'A5',0,0,0,'F5','E5','D5',0];
const MEL2=['A4',0,'D5',0,'F5',0,'E5',0,'D5',0,'C#5',0,'A4',0,0,0];
function pluck(f,t,dur,type,vol){
  const o=AC.createOscillator(),g=AC.createGain(),fl=AC.createBiquadFilter();
  o.type=type;o.frequency.value=f;fl.type='lowpass';fl.frequency.value=type==='square'?1800:900;
  env(g,t,vol,0.006,dur);o.connect(fl);fl.connect(g);g.connect(musBus);o.start(t);o.stop(t+dur+0.05);
}
function startMusic(){
  if(musicTimer||!AC)return;nextNote=AC.currentTime+0.15;
  musicTimer=setInterval(()=>{
    if(!AC)return;const step=60/112/2;
    if(nextNote<AC.currentTime-0.2)nextNote=AC.currentTime+0.05;
    while(nextNote<AC.currentTime+0.15){
      if(state!=='paused'){
        const i=musicStep%16,bar=Math.floor(musicStep/16)%4;
        if(BASS[i])pluck(nf(BASS[i]),nextNote,step*0.95,'triangle',0.5);
        const mel=bar===1?MEL1:bar===3?MEL2:null;
        if(mel&&mel[i])pluck(nf(mel[i]),nextNote,step*1.6,'square',0.06);
      }
      nextNote+=step;musicStep++;
    }
  },30);
}
function toggleMute(){
  save.muted=!save.muted;persist();
  if(master)master.gain.setTargetAtTime(save.muted?0:1,AC.currentTime,0.02);
}

/* ================= Game state ================= */
let state='menu',stateT=0,time=0,boil=0;
let cam=0,speed=0;
let ents=[],parts=[],texts=[],bats=[],decorMid=[],decorNear=[];
let midNext=0,nearNext=0,batT=1;
let gen=null,run=null;
let shake=0,flash=0,flashCol='#fff';
let banner=null,worldIdx=-1,resumeT=0;
let buttons=[];
let pointer={x:-999,y:-999},pointerIdle=0;
let godMode=false;
const stats={intro:0,free:0,obstacles:0,enemies:0};
const P={y:0,vy:0,rot:0,expr:'normal',exprT:0,blinkT:2,blink:0,flapK:0,pw:{magnet:0,boost:0,shield:0},
  grace:0,screamN:0,dead:false,spin:0,bounces:0,earT:2,ear:0};
const PT=()=>64,PB=()=>G-44;
const cliffTop=()=>G-150;
const difficulty=x=>clamp(x/CONFIG.rampDist,0,1);
const worldIndexAt=x=>Math.floor(Math.max(0,x)/CONFIG.worldLen)%4;
const score=()=>run?Math.floor((cam/10+run.blood*5+run.sheep*25+run.bonks*10)*(up('throne')>=3?1.25:1)):0;

function resetWorld(){
  cam=0;speed=0;ents=[];parts=[];texts=[];decorMid=[];decorNear=[];
  midNext=-150;nearNext=PX+80;
  gen={x:PX+260,count:0,last:'intro',gapY:null,sinceP:0,paused:false,nextBoss:CONFIG.bossAt};
  Object.assign(P,{y:cliffTop()-35,vy:0,rot:0,expr:'normal',exprT:0,flapK:0,grace:0,screamN:0,dead:false,spin:0,bounces:0});
  P.pw={magnet:0,boost:0,shield:0};
  run={blood:0,sheep:0,bonks:0,t:0,newBest:false,quip:'',screamHint:false,screamHintT:0,screamMsg:'',screamMsgT:0,screamNudge:0,
    combo:0,lastDrop:-9,finalScore:0,revives:0,unlocked:[],chests:0,toastMsg:'',toastT:0};
  worldIdx=-1;banner=null;
  spawnDecor();
}

/* ================= Particles & floating text ================= */
function addPart(o){if(parts.length>280)return;const p=Object.assign({vx:0,vy:0,life:1,grav:0,rot:0,vr:0,size:6,color:C.wool,kind:'puff'},o);p.max=p.life;parts.push(p);}
function puff(wx,y,n=1,col=C.wool){for(let i=0;i<n;i++)addPart({kind:'puff',x:wx+rand(-5,5),y:y+rand(-4,4),vx:rand(-50,15),vy:rand(-10,40),life:rand(.35,.65),size:rand(4,8),color:col});}
function burst(wx,y,n,col,spd=160){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=rand(spd*.4,spd);addPart({kind:'spark',x:wx,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.3,.6),size:rand(2,4.5),color:col,grav:220});}}
function feathers(wx,y,n=8,col='#fffaf0'){for(let i=0;i<n;i++)addPart({kind:'feather',x:wx+rand(-6,6),y:y+rand(-6,6),vx:rand(-120,120),vy:rand(-170,-30),life:rand(.8,1.4),size:rand(4,7),color:col,grav:130,rot:Math.random()*6,vr:rand(-6,6)});}
function ring(wx,y,col,size=20,life=.6){addPart({kind:'ring',x:wx,y,life,size,color:col});}
function popText(wx,y,txt,col=C.wool,size=22){texts.push({x:wx,y,txt,col,size,life:1.1,max:1.1});}

/* ================= Level generation ================= */
const addEnt=e=>{ents.push(e);return e;};
const addDrop=(wx,y)=>addEnt({type:'drop',wx,y,ph:Math.random()*6});
function pickPower(){const r=Math.random();return r<0.4?'magnet':r<0.72?'shield':'boost';}
const addPower=(wx,y,kind)=>addEnt({type:'power',wx,y,kind:kind||pickPower(),ph:0});
const addSheep=wx=>addEnt({type:'sheep',wx,y:G,ph:Math.random()*6,state:'graze',t:0,alert:false});

function genSection(){
  const x0=gen.x,d=difficulty(x0),c=gen.count;
  let type,len;
  if(c>3&&x0>=gen.nextBoss){
    addEnt({type:'boss',wx:x0+200,sx:W+120,y:PT()+110,state:'wait',t:0,hp:3,ph:0,time:0,startX:x0,attack:-1,dropT:2,lane:0,eggs:0,tired:0});
    gen.paused=true;gen.last='boss';return;
  }
  if(c===0)type='intro';
  else if(c===1)type='obstacles';
  else if(c===2)type='free';
  else if(c===3)type='enemies';
  else{
    const wf=lerp(.58,.45,d),wo=lerp(.27,.33,d),r=Math.random();
    type=r<wf?'free':r<wf+wo?'obstacles':'enemies';
    if(type!=='free'&&gen.last!=='free'&&Math.random()<0.5)type='free';
  }
  if(type==='intro')len=genFree(x0,900,true);
  else if(type==='free')len=genFree(x0,randi(700,1050),false);
  else if(type==='obstacles')len=genObstacles(x0,d,c===1?2:randi(3,4),c===1);
  else len=genEnemies(x0,d,c===3);
  stats[type]+=len;gen.x+=len;gen.count++;gen.last=type;
}
function genFree(x0,len,intro){
  let x=x0+(intro?140:110);const end=x0+len-80;
  const pats=intro?1:randi(1,2);
  for(let p=0;p<pats&&x<end;p++){
    const n=randi(5,8),y=rand(PT()+70,PB()-90),kind=pick(['wave','arc','line','diag','zig']),dir=Math.random()<.5?1:-1;
    for(let i=0;i<n&&x+i*42<end;i++){
      let yy=y;
      if(kind==='wave')yy=y+Math.sin(i*0.9)*40;
      else if(kind==='arc')yy=y-Math.sin(i/(n-1)*Math.PI)*70+35;
      else if(kind==='diag')yy=y+(i-(n-1)/2)*18*dir;
      else if(kind==='zig')yy=y+(i%2?-14:14);
      addDrop(x+i*42,clamp(yy,PT()+10,PB()-10));
    }
    x+=n*42+rand(90,170);
  }
  if(intro||Math.random()<CONFIG.sheepChance){
    const sx=x0+len*(intro?0.78:rand(.45,.85));
    addSheep(sx);
    if(intro)for(let k=0;k<4;k++)addDrop(sx-200+k*46,lerp(PB()-210,G-150,k/3));
  }
  if(!intro){
    const force=gen.count===2||gen.sinceP>=2;
    if(force||Math.random()<powerChance()){addPower(x0+len*rand(.3,.7),rand(PT()+50,PB()-150),gen.count===2?'shield':undefined);gen.sinceP=0;}
    else gen.sinceP++;
    const firstChest=save.stats.chestsFound===0&&run.chests===0&&!gen.chestGiven&&gen.count>=5;
    if(gen.count>=4&&(firstChest||Math.random()<CONFIG.chestChance)){addEnt({type:'chest',wx:x0+len*rand(.35,.75),y:rand(PT()+60,PB()-130),ph:0});gen.chestGiven=true;}
  }
  return len;
}
function makeStake(wx,gy,gap,kind){
  const top=gy-gap/2,bot=gy+gap/2,w=kind==='tower'?54:44,cx=w/2,rects=[];
  if(kind==='pair')rects.push([5,w-5,-400,top-16],[cx-9,cx+9,-400,top-3]);
  if(kind==='branch')rects.push([cx-11,cx+11,-400,top-6]);
  if(kind==='pair')rects.push([5,w-5,bot+16,G+80],[cx-9,cx+9,bot+3,G+80]);
  if(kind==='tower')rects.push([4,w-4,bot+40,G+80],[cx-12,cx+12,bot+14,G+80]);
  addEnt({type:'stake',kind,wx,w,gy,gap,top,bot,rects,seed:Math.random()*100,passed:false,hitFx:false});
}
function genObstacles(x0,d,n,tutorial){
  const gap=lerp(CONFIG.gapStart,CONFIG.gapMin,d)+(tutorial?30:0);
  const spacing=lerp(300,250,d);
  const lo=50+gap/2,hi=G-36-gap/2;
  let gy=gen.gapY==null?(lo+hi)/2:clamp(gen.gapY,lo,hi);
  for(let i=0;i<n;i++){
    const shift=tutorial?70:lerp(110,185,d);
    gy=clamp(gy+rand(-shift,shift),lo,hi);
    const r=Math.random();
    const kind=d>0.12&&r<0.16?'tower':d>0.12&&r<0.30?'branch':'pair';
    const wx=x0+170+i*spacing;
    makeStake(wx,gy,gap,kind);
    addDrop(wx+(kind==='tower'?27:22),gy);
  }
  gen.gapY=gy;
  return 170+n*spacing+30;
}
function spawnEnemy(t,wx,d){
  const chick=(x,hk,late)=>addEnt({type:'chicken',wx:x,y:G-2,vy:0,vx:0,state:'idle',t:0,h:hk*(G-PT()),ph:Math.random()*6,late:late||0});
  if(t==='chicken'){chick(wx,rand(.32,.58));if(d>0.45&&Math.random()<.4)chick(wx+80,rand(.15,.3),0.45);}
  else if(t==='farmer'){const fast=d>0.12&&Math.random()<0.22+0.28*d;addEnt({type:'farmer',wx,state:'idle',t:0,throws:fast?1:d>0.55?2:1,ph:0,fast,aimY:0,locked:false});if(d>0.4&&Math.random()<0.35)chick(wx-140,rand(.3,.5));}
  else if(t==='hen')addEnt({type:'hen',wx,y:rand(PT()+56,PT()+96),state:'wait',t:0,drop:0.45,eggs:randi(3,4)+(d>0.6?1:0),ph:0});
  else if(t==='rooster')addEnt({type:'rooster',wx,y:0,state:'pending',t:0,ph:0});
}
function genEnemies(x0,d,intro){
  const pool=['chicken','farmer'];
  if(x0>1800)pool.push('hen');
  if(x0>3000)pool.push('rooster');
  const n=intro?2:randi(2,d>0.5?3:2)+(d>0.8&&Math.random()<0.3?1:0);
  const spacing=lerp(470,380,d);
  let last='';
  for(let i=0;i<n;i++){
    const t=intro?(i===0?'chicken':'farmer'):pick(pool.filter(p=>p!==last));
    last=t;const wx=x0+200+i*spacing;
    spawnEnemy(t,wx,intro?0:d);
    if(i<n-1){
      if(Math.random()<0.7){const yy=rand(PT()+60,PB()-130);for(let k=0;k<3;k++)addDrop(wx+spacing*0.5-42+k*42,yy);}
      else if(Math.random()<0.5){addPower(wx+spacing*0.5,rand(PT()+60,PB()-140));gen.sinceP=0;}
    }
  }
  return 200+n*spacing+60;
}
function spawnDecor(){
  const off=cam*0.35;
  while(midNext<off+W+160){
    const w=WORLDS[worldIndexAt(cam+W)];
    decorMid.push({x:midNext,type:pick(w.decor),seed:Math.random()*100,s:rand(.8,1.15)});
    midNext+=rand(130,300);
  }
  while(nearNext<cam+W+120){
    const w=WORLDS[worldIndexAt(nearNext)];
    decorNear.push({x:nearNext,type:pick(w.near),seed:Math.random()*100,s:rand(.85,1.1)});
    nearNext+=rand(70,210);
  }
}

/* ================= Actions ================= */
function startRun(){
  unlockAudio();
  state='playing';stateT=0;
  P.vy=-480;P.expr='happy';P.exprT=0.7;
  run.revives=up('throne')>=1?1:0;
  if(up('throne')>=2)P.screamN=Math.floor(screamCost()/2);
  if(up('library')>=3)P.pw.shield=4;
  const se=season();
  for(const sk of SKINS)if(sk.how==='season'&&sk.season===se&&unlockSkin(sk.id)){run.unlocked.push(sk.name);toast(sk.name+' Sheepula unlocked! (event)');}
  sfx.flap();puff(cam+PX-10,P.y+22,5);
}
function restart(){resetWorld();state='menu';startRun();}
function toast(m){if(run){run.toastMsg=m;run.toastT=3;}}
function goMenu(){resetWorld();state='menu';stateT=0;sfx.click();}
function pause(){if(state==='playing'){state='paused';stateT=0;}}
function resume(){if(state==='paused'){state='resuming';resumeT=1.2;sfx.click();}}
function flap(){
  if(P.dead)return;
  P.vy=CONFIG.flapVel;P.flapK=1;sfx.flap();
  puff(cam+PX-14,P.y+20,1);
}
function addScream(n){
  const cost=screamCost(),was=P.screamN>=cost;
  P.screamN=Math.min(cost,P.screamN+n);
  if(!was&&P.screamN>=cost){sfx.ready();if(!run.screamHint){run.screamHint=true;run.screamHintT=3.2;}}
}
function collectDrop(e){
  run.blood++;
  run.combo=(time-run.lastDrop<0.6)?run.combo+1:0;run.lastDrop=time;
  sfx.drop(run.combo);burst(e.wx,e.y,6,C.blood,120);
  addScream(1);
  if(P.exprT<=0||P.expr==='normal'){P.expr='happy';P.exprT=0.25;}
}
function applyPower(kind,wx,y){
  P.pw[kind]=pwDur(kind);sfx.power();ring(wx,y,kind==='shield'?C.shield:C.blood,18,.5);
  popText(cam+PX+10,P.y-36,{magnet:'BLOOD MAGNET!',boost:'BAT BOOST!',shield:'NIGHT SHIELD!'}[kind],kind==='shield'?C.shield:C.blood,24);
  if(kind==='boost'){P.expr='angry';P.exprT=pwDur('boost');}
}
function stealSheep(e){
  e.state='taken';e.t=0;e.wx0=e.wx;e.y0=e.y;
  run.sheep++;addScream(3);
  const bonus=2*up('pen');if(bonus){run.blood+=bonus;popText(e.wx+26,G-98,'+'+bonus+' blood',C.blood,18);}
  sfx.baa();popText(e.wx,G-50,'Bää!',C.wool,24);popText(e.wx+20,G-74,'+25',C.warn,20);
  P.expr='happy';P.exprT=0.6;puff(e.wx,G-14,6);
}
function scare(e){
  if(e.state==='flee')return;
  e.state='flee';e.t=0;e.vy=-320;
  if(e.type!=='farmer')feathers(e.wx,(e.type==='chicken'?e.y-14:e.y),7,e.type==='hen'?'#c99462':'#fffaf0');
  else popText(e.wx,G-130,'EEK!',C.wool,22);
}
function bonk(e){
  scare(e);run.bonks++;sfx.bonk();shake=Math.max(shake,5);
  popText(cam+PX+16,P.y-30,'BONK!',C.warn,24);
}
function doScream(){
  if(state!=='playing'||P.dead)return;
  const cost=screamCost();
  if(P.screamN<cost){run.screamNudge=0.4;run.screamMsg=(cost-P.screamN)+' more drops to charge';run.screamMsgT=1.6;sfx.click();return;}
  P.screamN=0;P.expr='angry';P.exprT=0.9;shake=11;sfx.scream();P.grace=Math.max(P.grace,0.5);save.stats.screams++;
  ring(cam+PX,P.y,C.blood,20,.7);ring(cam+PX,P.y,'#ffffff',10,.5);
  popText(cam+PX+20,P.y-44,'MWAHAHA!',C.blood,30);
  let n=0;
  for(const e of ents){
    const sx=e.wx-cam;if(sx<-80||sx>W+340)continue;
    if(e.type==='boss'){if(['enter','swoopWarn','swoop','eggs','chicks','leave','tired'].includes(e.state)){bossHit(e,true);n++;}continue;}
    if(e.type==='rooster'&&(e.state==='pending'||e.state==='warn')){if(e.state==='warn')n++;e.dead=true;continue;}
    if((e.type==='chicken'||e.type==='rooster'||e.type==='hen'||e.type==='farmer')&&e.state!=='flee'){scare(e);n++;}
    else if(e.type==='fork'||e.type==='egg'){e.dead=true;burst(e.wx,e.y,8,'#fff',140);}
  }
  if(n){run.bonks+=n;popText(cam+PX+20,P.y-74,'+'+n*10,C.warn,22);}
}
function die(){
  if(godMode)return;
  if(run.revives>0){
    run.revives--;P.pw.shield=2.5;P.vy=-480;if(P.y>G-60)P.y=G-60;
    shake=10;flash=0.35;flashCol=C.gold;sfx.power();puff(cam+PX,P.y,6);
    popText(cam+PX,P.y-40,'SECOND BITE!',C.gold,28);return;
  }
  P.dead=true;state='dying';stateT=0;
  P.vy=-360;P.spin=(Math.random()<.5?-1:1)*9;P.expr='dizzy';P.exprT=99;
  shake=16;flash=0.5;flashCol='#ff2a4a';
  sfx.hit();puff(cam+PX,P.y,9);
  popText(cam+PX,P.y-34,pick(['OOF!','BAAH!','OUCH!']),C.warn,30);
}
function gameOver(){
  state='over';stateT=0;
  run.finalScore=score();
  run.newBest=run.finalScore>save.best&&run.finalScore>0;
  if(run.newBest)save.best=run.finalScore;
  save.blood+=run.blood;save.sheep+=run.sheep;save.runs++;
  save.stats.meters+=cam/10;save.stats.bestBlood=Math.max(save.stats.bestBlood,run.blood);
  save.chests+=run.chests;save.stats.chestsFound+=run.chests;
  persist();
  run.unlocked.push(...checkUnlocks());
  run.quip=pick(QUIPS);
  run.newBest?sfx.best():sfx.over();
}

/* ================= Update ================= */
function throwFork(f,fast){
  const hx=f.wx-16,hy=G-118;
  const ty=fast?f.aimY:clamp(P.y,PT(),PB());
  const close=fast?CONFIG.fastFork:230,dist=(hx-cam)-PX,tt=Math.max(fast?0.18:0.45,dist/close);
  const vxw=speed-close,vy=(ty-hy)/tt;
  addEnt({type:'fork',wx:hx,y:hy,vxw,vy,rot:Math.atan2(vy,-close),fast:!!fast});
  if(fast){sfx.whoosh();popText(f.wx,G-140,'HYAAH!',C.blood,24);shake=Math.max(shake,4);}else sfx.throw();
}
function bossNext(b){
  b.attack=(b.attack+1)%3;
  if(b.attack===0){b.state='swoopWarn';b.t=1.0;b.lane=clamp(P.y,PT()+40,PB()-40);sfx.warn();}
  else if(b.attack===1){b.state='eggs';b.eggs=5+(3-b.hp);b.t=0.6;}
  else{b.state='chicks';b.t=1.7;spawnChicks();sfx.cluck();}
}
function spawnChicks(){
  const n=5,top=PT()+30,bot=PB()-20,step=(bot-top)/(n-1),gap=randi(0,n-2);
  for(let i=0;i<n;i++){if(i===gap||i===gap+1)continue;addEnt({type:'rooster',chick:true,wx:cam+W+40,y:top+i*step,state:'warn',t:0.95+Math.random()*0.25,ph:Math.random()*6});}
}
function bossHit(b,byScream){
  b.hp--;sfx.bonk();sfx.cluck();feathers(b.wx,b.y-34,14,'#c99462');shake=Math.max(shake,8);
  popText(b.wx,b.y-96,byScream?'SHRIEK!':'BONK!',C.warn,30);run.bonks+=5;
  if(!byScream){P.vy=-380;P.grace=Math.max(P.grace,0.7);}
  for(const e of ents)if((e.type==='egg')||(e.type==='rooster'&&e.chick)){e.dead=true;burst(e.wx,e.y,6,'#fff',120);}
  if(b.hp<=0)bossDefeated(b);else{b.state='hurt';b.t=0;}
}
function bossDefeated(b){
  b.state='defeated';b.t=0;run.chests++;run.blood+=30;run.bonks+=10;save.stats.bosses++;
  banner={text:'Mother Hen defeated!',sub:'+1 rare chest  ·  +30 blood',t:0};sfx.best();
  popText(b.wx,b.y-110,'My chicks!',C.wool,24);
  if(unlockSkin('count')){run.unlocked.push('Count');toast('Count Sheepula unlocked!');}
}
function endBoss(){gen.paused=false;gen.x=Math.max(gen.x,cam+W+150);gen.nextBoss=gen.x+CONFIG.bossEvery;gen.last='free';}
function updateBoss(b,dt){
  b.ph+=dt*(b.state==='tired'?8:18);
  if(b.state==='wait'){
    b.wx=b.startX+200;
    if(cam+W*0.5>b.startX){b.state='enter';b.t=0;b.sx=W+120;b.y=PT()+110;banner={text:'Mother Hen',sub:'Boss fight!',t:0};sfx.crow();sfx.warn();}
    return;
  }
  b.time+=dt;b.wx=cam+b.sx;
  b.dropT-=dt;
  if(b.dropT<=0&&b.state!=='defeated'&&b.state!=='giveup'){b.dropT=rand(1.6,2.4);const yy=rand(PT()+40,PB()-60);addDrop(cam+W+30,yy);addDrop(cam+W+72,yy);}
  if(b.time>CONFIG.bossTime&&b.state!=='defeated'&&b.state!=='giveup'){b.state='giveup';b.t=0;popText(b.wx,b.y-90,'Hmph!',C.wool,26);}
  switch(b.state){
    case 'enter':b.t+=dt;b.sx=damp(b.sx,W*0.78,4,dt);b.y=damp(b.y,PT()+110,4,dt);if(b.t>1.1)bossNext(b);break;
    case 'swoopWarn':b.t-=dt;b.sx=damp(b.sx,W*0.86,5,dt);b.y=damp(b.y,b.lane,6,dt);if(b.t<=0){b.state='swoop';sfx.crow();}break;
    case 'swoop':b.sx-=560*dt;b.y=b.lane+Math.sin(b.ph*0.3)*4;if(b.sx<-140){b.state='tired';b.tired++;b.sx=W+70;b.y=rand(PT()+140,PB()-140);sfx.cluck();}break;
    case 'eggs':
      b.sx=damp(b.sx,W*0.72,3,dt);b.y=damp(b.y,PT()+60,3,dt);b.t-=dt;
      if(b.t<=0&&b.eggs>0){b.t=0.5;b.eggs--;addEnt({type:'egg',wx:b.wx,y:b.y-6,vy:60});sfx.plop();}
      if(b.eggs<=0&&b.t<=0){b.state='leave';b.t=0;}
      break;
    case 'chicks':b.t-=dt;b.sx=damp(b.sx,W*0.8,3,dt);if(b.t<=0){b.state='leave';b.t=0;}break;
    case 'leave':b.sx+=380*dt;b.y-=60*dt;if(b.sx>W+120){b.state='tired';b.tired++;b.sx=W+70;b.y=rand(PT()+140,PB()-140);}break;
    case 'tired':b.sx-=170*dt;b.y+=Math.sin(b.ph*0.25)*20*dt;if(b.sx<-120){b.state='enter';b.t=0;b.sx=W+120;b.y=PT()+110;}break;
    case 'hurt':b.t+=dt;b.sx+=420*dt;b.y-=200*dt;if(b.t>0.9){b.state='enter';b.t=0;b.sx=W+120;b.y=PT()+110;}break;
    case 'defeated':b.t+=dt;b.sx+=200*dt;b.y-=160*dt;if(b.t>2.2){b.dead=true;endBoss();}break;
    case 'giveup':b.t+=dt;b.sx+=300*dt;b.y-=120*dt;if(b.t>1.6){b.dead=true;endBoss();}break;
  }
}
function updateEnt(e,dt){
  const sx=e.wx-cam;
  switch(e.type){
    case 'drop':
      e.ph+=dt*4;
      if(P.pw.magnet>0&&!P.dead){
        const dx=(cam+PX)-e.wx,dy=P.y-e.y,dd=Math.hypot(dx,dy);
        if(dd<200&&dd>0.01){const s=Math.min(dd,(520+speed)*dt);e.wx+=dx/dd*s;e.y+=dy/dd*s;}
      }
      break;
    case 'power':e.ph+=dt;break;
    case 'sheep':
      e.ph+=dt*3;
      if(e.state==='graze'){const dx=e.wx-(cam+PX);e.alert=dx<260&&dx>-40;}
      else{e.t+=dt;const k=smooth(Math.min(1,e.t/0.45));e.wx=lerp(e.wx0,cam+PX,k);e.y=lerp(e.y0,P.y+18,k);if(e.t>=0.45)e.dead=true;}
      break;
    case 'chicken':
      if(e.state==='idle'){
        e.ph+=dt*6;
        const trig=230+speed*0.55+e.late*speed;
        if(!P.dead&&state==='playing'&&e.wx-(cam+PX)<trig){e.state='warn';e.t=0.45;sfx.cluck();}
      }else if(e.state==='warn'){e.t-=dt;e.ph+=dt*20;if(e.t<=0){e.state='air';e.vy=-Math.sqrt(2*900*e.h);e.vx=-70;sfx.cluck();}}
      else if(e.state==='air'){e.vy+=900*dt;e.y+=e.vy*dt;e.wx+=e.vx*dt;e.ph+=dt*30;if(e.y>=G-2&&e.vy>0){e.y=G-2;e.vy=0;e.state='landed';}}
      else if(e.state==='landed')e.ph+=dt*6;
      else if(e.state==='flee'){e.vy=Math.min(e.vy,-260);e.y+=e.vy*dt;e.wx+=(speed+140)*dt;e.ph+=dt*34;if(e.y<-80)e.dead=true;}
      break;
    case 'farmer':
      if(e.state==='idle'){
        const throwDist=clamp(W-PX-50,210,420);
        if(!P.dead&&state==='playing'&&sx-PX<throwDist+speed*0.85&&sx-PX>150){
          if(e.fast){e.state='fastWind';e.t=CONFIG.fastWind;e.locked=false;e.aimY=clamp(P.y,PT(),PB());sfx.growl();
            if(!save.stats.fastSeen){save.stats.fastSeen=1;persist();toast('Red line = super fast pitchfork. Get off it!');}}
          else{e.state='wind';e.t=0.85;sfx.warn();}
        }
      }else if(e.state==='fastWind'){
        e.t-=dt;
        if(e.t>CONFIG.fastLock)e.aimY=clamp(P.y,PT(),PB());
        else if(!e.locked){e.locked=true;sfx.lock();}
        if(e.t<=0){if(sx-PX>90&&!P.dead)throwFork(e,true);e.throws=0;e.state='fist';e.t=0.5;}
      }else if(e.state==='wind'){
        e.t-=dt;
        if(e.t<=0){
          if(sx-PX>110&&!P.dead){throwFork(e);e.throws--;}else e.throws=0;
          e.state=e.throws>0?'rewind':'fist';e.t=0.5;
        }
      }else if(e.state==='rewind'){e.t-=dt;if(e.t<=0){e.state='wind';e.t=0.6;sfx.warn();}}
      else if(e.state==='fist')e.ph+=dt*14;
      else if(e.state==='flee'){e.wx+=(speed+60)*dt;e.ph+=dt*18;if(sx>W+80)e.dead=true;}
      break;
    case 'fork':
      e.wx+=e.vxw*dt;e.y+=e.vy*dt;
      if(e.y>G+10||sx<-120)e.dead=true;
      break;
    case 'hen':
      if(e.state==='wait'){if(sx<W+30)e.state='fly';}
      else if(e.state==='fly'){
        e.wx+=speed*0.6*dt;e.ph+=dt*18;e.drop-=dt;
        if(sx<PX+70)e.state='leave';
        else if(e.drop<=0&&e.eggs>0&&sx<W-10){e.state='lay';e.t=0.3;}
      }else if(e.state==='lay'){
        e.wx+=speed*0.6*dt;e.ph+=dt*34;e.t-=dt;
        if(e.t<=0){addEnt({type:'egg',wx:e.wx,y:e.y+14,vy:40});e.eggs--;e.drop=rand(.8,1.0);e.state=e.eggs>0?'fly':'leave';sfx.plop();}
      }else if(e.state==='leave'){e.wx+=speed*0.6*dt;e.y-=70*dt;e.ph+=dt*18;if(e.y<-60)e.dead=true;}
      else if(e.state==='flee'){e.y-=280*dt;e.wx+=speed*dt;e.ph+=dt*30;if(e.y<-60)e.dead=true;}
      break;
    case 'egg':
      e.vy+=800*dt;e.y+=e.vy*dt;
      if(e.y>=G-6){e.dead=true;decorNear.push({x:e.wx,type:'splat',seed:Math.random()*100,s:1});if(sx>0&&sx<W)sfx.splat();}
      break;
    case 'boss':updateBoss(e,dt);break;
    case 'chest':e.ph+=dt;break;
    case 'rooster':
      if(e.state==='pending'){
        if(!P.dead&&state==='playing'&&sx<W+60){e.state='warn';e.t=0.95;e.y=clamp(P.y,PT()+10,PB()-20);sfx.warn();}
      }else if(e.state==='warn'){e.t-=dt;e.wx=cam+W+40;if(e.t<=0){e.state='fly';e.chick?sfx.cluck():sfx.crow();}}
      else if(e.state==='fly'){e.wx-=300*dt;e.ph+=dt*30;}
      else if(e.state==='flee'){e.y-=300*dt;e.wx+=(speed+100)*dt;e.ph+=dt*30;if(e.y<-80)e.dead=true;}
      break;
  }
}
function collide(){
  const pwx=cam+PX,py=P.y,R=CONFIG.hitR;
  const inv=P.pw.shield>0||P.pw.boost>0||P.grace>0||godMode;
  const hurt=(e,proj)=>{
    if(inv){
      if(proj){e.dead=true;burst(e.wx,e.y,8,'#fff',140);sfx.clank();}
      else bonk(e);
    }else die();
  };
  for(const e of ents){
    if(e.dead)continue;
    const sx=e.wx-cam;if(sx<-140||sx>W+140)continue;
    switch(e.type){
      case 'drop':if(hit(pwx,py,R+2,e.wx,e.y,12)){e.dead=true;collectDrop(e);}break;
      case 'power':if(hit(pwx,py,R+2,e.wx,e.y,18)){e.dead=true;applyPower(e.kind,e.wx,e.y);}break;
      case 'sheep':{const rx=60+30*up('pen'),ry=150+30*up('pen');if(e.state==='graze'&&Math.abs(e.wx-pwx)<rx&&py>G-16-ry)stealSheep(e);}break;
      case 'stake':
        for(const r of e.rects){
          if(circRect(pwx,py,R,e.wx+r[0],r[2],e.wx+r[1],r[3])){
            if(inv){if(!e.hitFx){e.hitFx=true;burst(pwx+10,py,10,C.gold,160);sfx.clank();}}
            else die();
            break;
          }
        }
        if(!e.passed&&!P.dead&&e.wx+e.w<pwx-R){
          e.passed=true;let clr=1e9;
          if(e.kind!=='tower')clr=Math.min(clr,(py-R)-e.top);
          if(e.kind!=='branch')clr=Math.min(clr,e.bot-(py+R));
          if(clr<10&&clr>-6){P.expr='scared';P.exprT=0.5;popText(pwx-10,py-34,'Phew!',C.wool,18);}
        }
        break;
      case 'chicken':if(e.state!=='flee'&&hit(pwx,py,R,e.wx,e.y-19,15))hurt(e);break;
      case 'rooster':if(e.state==='fly'&&hit(pwx,py,R,e.wx,e.y,e.chick?12:17))hurt(e);break;
      case 'chest':if(hit(pwx,py,R+2,e.wx,e.y,20)){e.dead=true;run.chests++;sfx.best();burst(e.wx,e.y,18,C.gold,200);popText(e.wx,e.y-30,'RARE CHEST!',C.gold,26);toast('Rare chest! Open it in your castle');}break;
      case 'boss':
        if(e.state==='wait'||e.state==='defeated'||e.state==='giveup'||e.state==='hurt')break;
        if(hit(pwx,py,R,e.wx,e.y-34,30)){if(e.state==='tired')bossHit(e,false);else if(!inv)die();}
        break;
      case 'hen':if((e.state==='fly'||e.state==='lay'||e.state==='leave')&&hit(pwx,py,R,e.wx,e.y-19,15))hurt(e);break;
      case 'farmer':if(e.state!=='flee'&&hit(pwx,py,R,e.wx,G-50,22))hurt(e);break;
      case 'fork':{const tx=e.wx+Math.cos(e.rot)*28,ty=e.y+Math.sin(e.rot)*28;if(hit(pwx,py,R,tx,ty,9)||hit(pwx,py,R,e.wx,e.y,6))hurt(e,true);}break;
      case 'egg':if(hit(pwx,py,R,e.wx,e.y,8))hurt(e,true);break;
    }
    if(P.dead)break;
  }
}
function updatePlayer(dt){
  P.flapK=Math.max(0,P.flapK-dt*4);
  P.blinkT-=dt;if(P.blinkT<=0){P.blink=0.13;P.blinkT=rand(2,4.5);}if(P.blink>0)P.blink-=dt;
  P.earT-=dt;if(P.earT<=0){P.ear=0.3;P.earT=rand(1.5,4);}if(P.ear>0)P.ear-=dt;
  if(P.exprT>0){P.exprT-=dt;if(P.exprT<=0&&!P.dead)P.expr=P.pw.boost>0?'angry':'normal';}
  for(const k in P.pw){
    if(P.pw[k]>0){P.pw[k]-=dt;if(P.pw[k]<=0){P.pw[k]=0;if(k!=='magnet')P.grace=Math.max(P.grace,CONFIG.grace);}}
  }
  if(P.grace>0)P.grace-=dt;
  if(run.screamHintT>0)run.screamHintT-=dt;
  if(run.screamMsgT>0)run.screamMsgT-=dt;
  if(run.toastT>0)run.toastT-=dt;
  if(run.screamNudge>0)run.screamNudge-=dt;
  P.vy=Math.min(P.vy+CONFIG.gravity*dt,CONFIG.maxFall);
  P.y+=P.vy*dt;
  if(!P.dead){
    if(P.y<16){P.y=16;if(P.vy<0)P.vy=0;}
    P.rot=damp(P.rot,clamp(P.vy/750,-0.42,0.8),10,dt);
    if(P.y>G-24){
      if(P.pw.shield>0||P.pw.boost>0||P.grace>0||godMode){P.y=G-24;P.vy=-430;burst(cam+PX,G-4,8,C.gold,140);sfx.bonk();}
      else{P.y=G-24;die();}
    }
    if(P.pw.boost>0&&Math.random()<dt*24)addPart({kind:'bat',x:cam+PX-20,y:P.y+rand(-14,14),vx:-60,vy:rand(-30,30),life:.6,size:rand(.5,.8),color:'#1a0d1c'});
    if(Math.random()<dt*14){
      const sk=save.skin;
      if(sk==='rainbow')addPart({kind:'spark',x:cam+PX-34,y:P.y+rand(-12,12),vx:-70,vy:rand(-20,20),life:.5,size:3.2,color:`hsl(${Math.floor(time*300)%360},90%,62%)`,grav:0});
      else if(sk==='disco'||sk==='golden')addPart({kind:'spark',x:cam+PX+rand(-30,30),y:P.y+rand(-30,30),vx:-40,vy:-20,life:.45,size:2.6,color:sk==='golden'?C.gold:['#ff4fd8','#3ef0ff','#ffd23f'][Math.floor(Math.random()*3)],grav:0});
      else if(sk==='pghost'||sk==='ghost')addPart({kind:'puff',x:cam+PX-28,y:P.y+rand(-6,16),vx:-60,vy:-10,life:.5,size:4,color:'rgba(210,235,255,0.55)'});
    }
  }else{
    P.rot+=P.spin*dt;
    if(P.y>G-24){
      P.y=G-24;
      if(P.bounces<1){P.vy=-200;P.bounces++;P.spin*=0.5;puff(cam+PX,G-6,4);sfx.thud();shake=Math.max(shake,6);}
      else{P.vy=0;P.spin=0;}
    }
    if(state==='dying'&&stateT>1.15)gameOver();
  }
}
function menuIdle(dt){
  P.blinkT-=dt;if(P.blinkT<=0){P.blink=0.13;P.blinkT=rand(2,4.5);}if(P.blink>0)P.blink-=dt;
  P.earT-=dt;if(P.earT<=0){P.ear=0.3;P.earT=rand(1.5,4);}if(P.ear>0)P.ear-=dt;
  pointerIdle+=dt;
  P.y=cliffTop()-35+Math.sin(time*2.2)*1.2;P.rot=0;
  P.expr=pointerIdle>14?'sleepy':'normal';
}
function updateBats(dt){
  batT-=dt;
  if(batT<=0){batT=rand(1.6,4.2);bats.push({x:W+30,y:rand(30,G*0.5),vx:-rand(40,90),ph:Math.random()*6,s:rand(.5,1),amp:rand(6,16),y0:0});bats[bats.length-1].y0=bats[bats.length-1].y;}
  for(const b of bats){b.x+=(b.vx-speed*0.3)*dt;b.ph+=dt*14;b.y=b.y0+Math.sin(b.ph*0.2)*b.amp;}
}
function updateFx(dt){
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.grav*dt;p.life-=dt;p.rot+=p.vr*dt;if(p.kind==='feather'){p.vx*=0.98;}}
  for(const t of texts){t.y-=36*dt;t.life-=dt;}
}
function update(dt){
  time+=dt;stateT+=dt;boil=Math.floor(time*7);
  shake=Math.max(0,shake-dt*40);flash=Math.max(0,flash-dt*2);
  if(state==='paused')return;
  if(state==='resuming'){resumeT-=dt;if(resumeT<=0){state='playing';}return;}
  updateBats(dt);
  if(state==='menu'){menuIdle(dt);updateFx(dt);return;}
  if(state==='castle'){
    menuIdle(dt);updateFx(dt);stageT+=dt;castleMsgT=Math.max(0,castleMsgT-dt);castleShakeT=Math.max(0,castleShakeT-dt);
    if(chestAnim){const pr=chestAnim.t;chestAnim.t+=dt;if(pr<0.75&&chestAnim.t>=0.75){sfx.best();if(chestAnim.px!=null)for(let i=0;i<30;i++)addPart({kind:'spark',x:chestAnim.px,y:chestAnim.py,vx:rand(-170,170),vy:rand(-240,-40),life:rand(.5,1),size:rand(2,4.5),color:[C.gold,'#fff1a8',C.blood][i%3],grav:260});}}
    return;
  }
  if(state==='over'){updateFx(dt);return;}
  const d=difficulty(cam);
  if(state==='playing'){
    run.t+=dt;
    const base=lerp(CONFIG.speedStart,CONFIG.speedMax,d);
    speed=damp(speed,base*(P.pw.boost>0?1.85:1),P.pw.boost>0?5:3,dt);
  }else speed=damp(speed,0,2.2,dt);
  cam+=speed*dt;
  const wi=Math.floor(cam/CONFIG.worldLen);
  if(state==='playing'&&wi!==worldIdx){worldIdx=wi;banner={text:WORLDS[wi%4].name,t:wi===0?-3.2:0};}
  if(banner){banner.t+=dt;if(banner.t>2.8)banner=null;}
  while(!gen.paused&&gen.x<cam+W+500)genSection();
  spawnDecor();
  updatePlayer(dt);
  for(const e of ents)updateEnt(e,dt);
  if(state==='playing')collide();
  updateFx(dt);
}
function cleanup(){
  ents=ents.filter(e=>!e.dead&&e.wx-cam>-320);
  parts=parts.filter(p=>p.life>0);texts=texts.filter(t=>t.life>0);
  const off=cam*0.35;
  decorMid=decorMid.filter(d=>d.x-off>-200);decorNear=decorNear.filter(d=>d.x-cam>-200);
  bats=bats.filter(b=>b.x>-40);
}

/* ================= Drawing helpers ================= */
function smoothClosed(pts){
  const n=pts.length;ctx.beginPath();
  ctx.moveTo((pts[n-1][0]+pts[0][0])/2,(pts[n-1][1]+pts[0][1])/2);
  for(let i=0;i<n;i++){const p=pts[i],q=pts[(i+1)%n];ctx.quadraticCurveTo(p[0],p[1],(p[0]+q[0])/2,(p[1]+q[1])/2);}
  ctx.closePath();
}
function wobPoly(pts,seed,amp=1.1){
  ctx.beginPath();
  for(let i=0;i<pts.length;i++){
    const p=pts[i],x=p[0]+(hash(seed+i*3.3+boil*1.9)-0.5)*2*amp,y=p[1]+(hash(seed+i*5.1+boil*2.7)-0.5)*2*amp;
    i?ctx.lineTo(x,y):ctx.moveTo(x,y);
  }
  ctx.closePath();
}
function wobCircle(x,y,r,seed,amp=1,n=14){
  const pts=[];
  for(let i=0;i<n;i++){const a=i/n*Math.PI*2,rr=r+(hash(seed+i*3.1+boil*7.7)-0.5)*2*amp;pts.push([x+Math.cos(a)*rr,y+Math.sin(a)*rr]);}
  smoothClosed(pts);
}
function wobRect(x,y,w,h,seed,amp=1.2){
  const r=Math.min(10,w/4,h/4);
  const pts=[[x+r,y],[x+w/2,y],[x+w-r,y],[x+w,y],[x+w,y+r],[x+w,y+h/2],[x+w,y+h-r],[x+w,y+h],[x+w-r,y+h],[x+w/2,y+h],[x+r,y+h],[x,y+h],[x,y+h-r],[x,y+h/2],[x,y+r],[x,y]];
  for(let i=0;i<pts.length;i++){pts[i][0]+=(hash(seed+i*2.1+boil*3.3)-0.5)*2*amp;pts[i][1]+=(hash(seed+i*4.7+boil*1.3)-0.5)*2*amp;}
  smoothClosed(pts);
}
function fluff(cx,cy,rx,ry,n,bump,seed){
  ctx.beginPath();
  for(let i=0;i<=n;i++){
    const k=i%n,a=k/n*Math.PI*2-Math.PI/2,j=(hash(seed+k*1.7+boil*0.37)-0.5)*0.08;
    const px=cx+Math.cos(a)*rx*(1+j),py=cy+Math.sin(a)*ry*(1+j);
    if(i===0){ctx.moveTo(px,py);continue;}
    const am=(i-0.5)/n*Math.PI*2-Math.PI/2,b=1+bump*(0.8+0.4*hash(seed+i*2.3));
    ctx.quadraticCurveTo(cx+Math.cos(am)*rx*b,cy+Math.sin(am)*ry*b,px,py);
  }
  ctx.closePath();
}
function inkIt(fill,lw=2.5,stroke=C.ink){if(fill){ctx.fillStyle=fill;ctx.fill();}if(lw){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();}}
function txt(s,x,y,{font=hand(22),col=C.wool,align='left',base='alphabetic',stroke=C.ink,sw=5}={}){
  ctx.font=font;ctx.textAlign=align;ctx.textBaseline=base;
  if(stroke){ctx.lineWidth=sw;ctx.strokeStyle=stroke;ctx.lineJoin='round';ctx.strokeText(s,x,y);}
  ctx.fillStyle=col;ctx.fillText(s,x,y);
}
function fitSize(s,maxW,size){ctx.font=hand(size);const w=ctx.measureText(s).width;return w<=maxW?size:Math.max(12,Math.floor(size*maxW/w));}
function dropShape(){
  ctx.beginPath();ctx.moveTo(0,-11);ctx.bezierCurveTo(4,-5,8,-1,8,4);ctx.arc(0,4,8,0,Math.PI,false);ctx.bezierCurveTo(-8,-1,-4,-5,0,-11);ctx.closePath();
}
function drawDropIcon(x,y,s=1){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);dropShape();inkIt(C.blood,2.2);
  ctx.beginPath();ctx.ellipse(-3,2,1.8,3,-0.4,0,7);ctx.fillStyle='rgba(255,255,255,0.7)';ctx.fill();ctx.restore();
}
function drawSheepIcon(x,y,s=1){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.lineJoin='round';
  fluff(2,0,12,9,8,.25,4);inkIt(C.wool,2);
  ctx.beginPath();ctx.ellipse(-9,1,5,6,0.2,0,7);inkIt('#2b2230',1.6);
  ctx.beginPath();ctx.arc(-10.5,0,1.1,0,7);ctx.fillStyle='#fff';ctx.fill();ctx.restore();
}
function drawBat(x,y,s,ph,col){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle=col;
  const f=Math.sin(ph)*0.8;
  for(const sd of [-1,1]){
    ctx.beginPath();ctx.moveTo(0,0);
    ctx.quadraticCurveTo(sd*8,-10-f*8,sd*18,-3-f*10);
    ctx.quadraticCurveTo(sd*13,-1,sd*12,3);ctx.quadraticCurveTo(sd*8,0,sd*6,4);ctx.quadraticCurveTo(sd*3,1,0,2);ctx.fill();
  }
  ctx.beginPath();ctx.ellipse(0,1,3,4.5,0,0,7);ctx.fill();
  ctx.beginPath();ctx.moveTo(-2.5,-2);ctx.lineTo(-2,-6);ctx.lineTo(-0.5,-3);ctx.lineTo(0.5,-3);ctx.lineTo(2,-6);ctx.lineTo(2.5,-2);ctx.fill();
  ctx.restore();
}

/* ================= Sheepula ================= */
function capePts(fl,lift){
  return [[14,-12],[-4,-37-fl*0.2],[-32,-36-fl*0.4],[-70,-14+fl*0.6],[-64,4+fl*0.8-lift],[-51,19+fl*0.8-lift],[-41,10+fl*0.6-lift],
    [-30,29+fl*0.5-lift],[-18,17+fl*0.3-lift],[-5,31-lift],[8,14]];
}
function fang(x,y,len){ctx.beginPath();ctx.moveTo(x-1.9,y);ctx.lineTo(x+1.9,y);ctx.lineTo(x,y+len);ctx.closePath();inkIt('#fffdf7',1.3);}
function ear(x,y,ang,flip){
  ctx.save();ctx.translate(x,y);ctx.rotate(ang);
  ctx.beginPath();ctx.ellipse(flip*9,0,10.5,5.6,0,0,7);inkIt('#f0d9cc',2.3);
  ctx.beginPath();ctx.ellipse(flip*9.5,0.6,6.2,2.7,0,0,7);ctx.fillStyle=C.pink;ctx.fill();
  ctx.restore();

const EYES=[[8,-12,9.5],[26,-11,9]];
const HDX=-2,HDY=3,HSC=1.12;
const unshift=()=>ctx.translate(-HDX/HSC,-HDY/HSC-24);
let curWool='#f5e9da';
function drawFace(expr,lx,ly,blink,id){
  if(id==='alien'){
    ctx.beginPath();ctx.ellipse(17,-28,6.4,6.8,0,0,7);inkIt('#fffdf7',2.4);
    if(blink){ctx.beginPath();ctx.moveTo(11.5,-28);ctx.lineTo(22.5,-28);ctx.strokeStyle=C.ink;ctx.lineWidth=2.2;ctx.stroke();}
    else{ctx.beginPath();ctx.arc(17+lx*0.6,-28+ly*0.6,2.6,0,7);ctx.fillStyle=C.ink;ctx.fill();}

function palette(){
  const x=Math.max(0,cam),i=Math.floor(x/CONFIG.worldLen);
  const cur=WORLDS[i%4],prev=WORLDS[(i+3)%4];
  const t=i===0?1:smooth(clamp((x-i*CONFIG.worldLen)/600,0,1));
  const m=k=>t>=1?cur[k]:mix(prev[k],cur[k],t);
  return {top:m('top'),bot:m('bot'),far:m('far'),mid:m('mid'),sil:m('sil'),ground:m('ground'),grass:m('grass'),
    amp:lerp(prev.amp,cur.amp,t),peak:lerp(prev.peak,cur.peak,t),snow:lerp(prev.snow,cur.snow,t)};
}
function ridgeY(wx,base,amp,seed,peak){
  const s=0.55*Math.sin(wx*0.0042+seed)+0.3*Math.sin(wx*0.0115+seed*2.3)+0.15*Math.sin(wx*0.029+seed*4.1);
  const p=(1-Math.abs(Math.sin(wx*0.0055+seed)))*1.3-0.3+0.12*Math.sin(wx*0.03+seed);
  return base-amp*(0.5+0.5*lerp(s,p,peak));
}
function drawRidge(par,base,amp,seed,peak,col,snow){

let castleTab='upgrades',castleMsg='',castleMsgT=0,castleShakeId='',castleShakeT=0,castleBox=null;
let castlePage=0,chestAnim=null,previewId='classic',stageT=0,stageFly=false;
function openWardrobe(){openCastle();castleTab='skins';}
function setPreview(id){if(previewId!==id){previewId=id;stageT=0;sfx.click();}const i=SKINS.findIndex(sk=>sk.id===id);if(i>=0)castlePage=Math.floor(i/6);}

function castleSay(msg,shakeId){castleMsg=msg;castleMsgT=1.9;if(shakeId){castleShakeId=shakeId;castleShakeT=0.4;}}
function castleBurst(){
  if(!castleBox)return;
  for(let i=0;i<28;i++)addPart({kind:'spark',x:castleBox.x+Math.random()*castleBox.w,y:castleBox.y+Math.random()*castleBox.h,vx:rand(-60,60),vy:rand(-130,-20),life:rand(.5,1),size:rand(2,4),color:Math.random()<.5?C.gold:C.blood,grav:120});
  flash=0.22;flashCol=C.gold;
}
function buyUpgrade(u){
  const l=up(u.id);if(l>=3){castleSay(u.name+' is fully built');return;}
  const cost=u.cost[l],need=u.sheep[l];
  if(save.sheep<need){castleSay('Steal '+(need-save.sheep)+' more sheep first',u.id);sfx.bonk();return;}
  if(save.blood<cost){castleSay('You need '+(cost-save.blood)+' more blood',u.id);sfx.bonk();return;}
  save.blood-=cost;save.up[u.id]=l+1;persist();sfx.power();
  castleSay(u.name+(l===0?' built!':' upgraded!'));castleBurst();
  const got=checkUnlocks();if(got.length)castleSay(got.join(', ')+' Sheepula unlocked!');
}
function pickSkin(sk){
  if(owns(sk.id)){if(save.skin!==sk.id){save.skin=sk.id;persist();sfx.click();}castleSay(sk.name+' Sheepula is ready');return;}
  if(sk.how==='blood'){
    if(save.blood<sk.cost){castleSay('You need '+(sk.cost-save.blood)+' more blood',sk.id);sfx.bonk();return;}
    save.blood-=sk.cost;save.skins.push(sk.id);save.skin=sk.id;persist();sfx.power();castleSay(sk.name+' Sheepula is yours!');castleBurst();return;
  }
  let msg=sk.label;
  if(sk.prog){const [c,t]=sk.prog();msg+=': '+Math.min(c,t).toLocaleString('en-US')+' / '+t.toLocaleString('en-US');}
  else if(sk.how==='season')msg=season()===sk.season?sk.label+' is on! Fly one run to unlock':sk.label+', comes back every year';
  else if(sk.how==='boss')msg='Beat Mother Hen (she shows up at 800 m)';
  else if(sk.how==='chest')msg='Only found in rare chests';
  castleSay(msg,sk.id);sfx.bonk();
}
function openChest(){
  if(chestAnim&&chestAnim.t<1.1)return;
  if(save.chests<=0){castleSay('No chests yet. Find them in the sky or beat Mother Hen');sfx.bonk();return;}
  save.chests--;
  const pool=SKINS.filter(sk=>sk.how==='chest'&&!owns(sk.id));let reward;
  if(pool.length&&(save.chestPity>=2||Math.random()<0.35)){const sk=pick(pool);save.skins.push(sk.id);save.chestPity=0;reward={kind:'skin',id:sk.id,name:sk.name};}
  else{const n=randi(40,110);save.blood+=n;save.chestPity++;reward={kind:'blood',n};}
  persist();chestAnim={t:0,reward,px:null,py:null};sfx.click();
}

  drawDropIcon(x+7,74,0.72);txt(b,x+18,81,{font:hand(20),sw:4});x+=18+wb+26;
  drawSheepIcon(x+9,73,0.7);txt(c,x+22,81,{font:hand(20),sw:4});
  const T=L.tabs,tw=(T.w-16)/3;
  [['upgrades','Upgrades'],['skins','Skins'],['chests',save.chests?'Chests ('+save.chests+')':'Chests']].forEach(([id,label],i)=>{
    const tx=T.x+i*(tw+8),onT=castleTab===id;
    wobRect(tx,T.y,tw,T.h,40+i,1);inkIt(onT?C.blood:'rgba(30,21,48,0.92)',2.4,onT?C.ink:'rgba(245,233,218,0.6)');
    txt(label,tx+tw/2,T.y+T.h/2+7,{font:hand(fitSize(label,tw-10,21)),col:onT?C.wool:C.dim,align:'center',sw:4});
    const dot=id==='upgrades'?UPGRADES.some(canBuy):id==='skins'?SKINS.some(sk=>sk.how==='blood'&&!owns(sk.id)&&save.blood>=sk.cost):save.chests>0;
    if(dot&&!onT){ctx.beginPath();ctx.arc(tx+tw-3,T.y+3,6,0,7);inkIt(C.blood,2);}
    buttons.push({x:tx,y:T.y,w:tw,h:T.h,act:()=>{if(castleTab!==id){castleTab=id;sfx.click();}}});
  });
  const R=L.list;
  if(castleTab==='upgrades'){
    const gap=6,ch=(R.h-gap*(UPGRADES.length-1))/UPGRADES.length;
    UPGRADES.forEach((u,i)=>drawUpgradeCard(u,R.x,R.y+i*(ch+gap),R.w,ch));
  }else if(castleTab==='skins')drawSkinsTab(R);
  else drawChestsTab(R);
  if(castleMsgT>0){
    ctx.globalAlpha=Math.min(1,castleMsgT*2);
    txt(castleMsg,L.scene.x+L.scene.w/2,castleTab==='skins'?L.scene.y+66:L.scene.y+18,{font:hand(fitSize(castleMsg,L.scene.w-10,21)),col:C.warn,align:'center',sw:5});
    ctx.globalAlpha=1;
  }
}

/* ================= Frame ================= */
let lineupSpec=null;
function drawLineup(){
  const L=lineupSpec;ctx.fillStyle='#2a1d45';ctx.fillRect(0,0,W,H);
  const cols=L.cols,rows=Math.ceil(L.ids.length/cols),cw=W/cols,ch=H/rows;
  L.ids.forEach((id,i)=>{const cx=(i%cols)*cw+cw/2,cy=Math.floor(i/cols)*ch+ch*0.55;
    drawSheepula(cx-6*L.sc,cy,L.flying?0.15:0,{skin:id,scale:L.sc,flying:L.flying,expr:'normal',blink:false,lx:2,ly:0});
    txt(id,cx,Math.floor(i/cols)*ch+ch-8,{font:hand(16),align:'center',sw:3});});
}
function draw(){
  buttons=[];
  ctx.setTransform(DPR*S,0,0,DPR*S,0,0);
  if(lineupSpec){drawLineup();return;}
  const pal=palette();
  if(state==='castle'){
    drawCastleScreen(pal);
    if(flash>0){ctx.globalAlpha=flash*0.45;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
    return;
  }
  ctx.save();
  if(shake>0)ctx.translate(rand(-1,1)*shake*0.5,rand(-1,1)*shake*0.5);
  drawSky(pal);
  drawRidge(0.12,G-110,pal.amp,2.1,pal.peak,pal.far,pal.snow);
  for(const b of bats)drawBat(b.x,b.y,b.s,b.ph,'rgba(14,8,22,0.85)');
  drawMid(pal);
  const fog=ctx.createLinearGradient(0,G-90,0,G);fog.addColorStop(0,'rgba(200,170,230,0)');fog.addColorStop(1,'rgba(200,170,230,0.12)');
  ctx.fillStyle=fog;ctx.fillRect(-20,G-90,W+40,90);
  drawGround(pal);
  drawNear(pal);
  drawCliff();
  drawEntities();
  drawPlayer();
  drawParts();
  drawWarnings();
  ctx.restore();
  ctx.fillStyle=vignette;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalAlpha=0.55;ctx.fillStyle=grainPat;ctx.fillRect(0,0,W,H);ctx.restore();
  if(state==='menu')drawMenu();
  else if(state==='playing'||state==='dying'||state==='paused'||state==='resuming')drawHUD();
  if(state==='paused')drawPaused();
  if(state==='resuming')drawResuming();
  if(state==='over')drawOver();
  if(flash>0){ctx.globalAlpha=flash*0.45;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
}
let last=performance.now();
function frame(now){
  let dt=(now-last)/1000;last=now;
  if(!(dt>0))dt=0;if(dt>0.05)dt=0.05;
  const n=Math.max(1,Math.ceil(dt/(1/120))),h=dt/n;
  for(let i=0;i<n;i++)update(h);
  cleanup();draw();
  requestAnimationFrame(frame);
}

/* ================= Input ================= */
function toVirtual(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/S,y:(e.clientY-r.top)/S};}
function press(x,y){
  for(let i=buttons.length-1;i>=0;i--){const b=buttons[i];if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){b.act();return;}}
  if(state==='menu')startRun();
  else if(state==='playing')flap();
  else if(state==='paused')resume();
  else if(state==='over'&&stateT>0.6)restart();
}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();try{cv.focus({preventScroll:true});}catch(_){}
  unlockAudio();const p=toVirtual(e);pointer=p;pointerIdle=0;press(p.x,p.y);
});
cv.addEventListener('pointermove',e=>{pointer=toVirtual(e);pointerIdle=0;});
cv.addEventListener('pointerleave',()=>{pointer={x:-999,y:-999};});
cv.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('keydown',e=>{
  const k=e.code;
  if(k==='Space'||k==='ArrowUp'||k==='KeyW'||k==='Enter'||k==='NumpadEnter'){
    e.preventDefault();if(e.repeat)return;unlockAudio();pointerIdle=0;
    if(state==='menu')startRun();else if(state==='playing')flap();else if(state==='paused')resume();else if(state==='over'&&stateT>0.5)restart();else if(state==='castle')restart();
  }else if(k==='KeyP'||k==='Escape'){if(state==='playing')pause();else if(state==='paused')resume();else if(state==='castle'&&k==='Escape')goMenu();}
  else if(k==='KeyS'||k==='KeyX'||k==='ShiftLeft'||k==='ShiftRight'){if(!e.repeat)doScream();}
  else if(k==='KeyM')toggleMute();
  else if(k==='KeyC'){if(state==='menu'||(state==='over'&&stateT>0.5))openCastle();}
  else if(k==='KeyK'){if(state==='menu'||(state==='over'&&stateT>0.5))openWardrobe();}
  else if((k==='ArrowLeft'||k==='ArrowRight')&&state==='castle'&&castleTab==='skins'){const i=SKINS.findIndex(sk=>sk.id===previewId),d=k==='ArrowLeft'?-1:1;setPreview(SKINS[(i+d+SKINS.length)%SKINS.length].id);}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
window.addEventListener('resize',resize);
try{new ResizeObserver(()=>resize()).observe(cv);}catch(e){}

/* ================= Boot ================= */
resize();resetWorld();
requestAnimationFrame(t=>{last=t;requestAnimationFrame(frame);});

/* Test hooks for automated play-testing (harmless in normal play) */
function autopilot(){
  if(state!=='playing')return;
  let target=(PT()+PB())/2;
  for(const e of ents){if(e.type==='stake'&&e.wx+e.w>cam+PX-20){target=e.gy;break;}}
  if(P.y>target+10&&P.vy>-60)flap();
}
window.__sheepula={
  get state(){return state;},get cam(){return cam;},get score(){return score();},get run(){return run;},stats,
  set god(v){godMode=!!v;},start(){if(state==='menu')startRun();else restart();},flap,scream:doScream,pause,resume,
  sim(seconds,auto=true){for(let i=0;i<seconds*60;i++){if(auto)autopilot();update(1/60);cleanup();}return {state,cam:Math.round(cam),score:score(),blood:run.blood,sheep:run.sheep};},
  give(k){P.pw[k]=pwDur(k);},charge(){P.screamN=screamCost();},get screamN(){return P.screamN;},
  get G(){return G;},get dbg(){return {S,W,H,state,btn:buttons.map(b=>[Math.round(b.x),Math.round(b.y),Math.round(b.w),Math.round(b.h)])};},get py(){return P.y;},
  castle(){openCastle();},tab(t){castleTab=t;},rich(b,sh){save.blood+=b;save.sheep+=sh;persist();},buy(id){buyUpgrade(UPGRADES.find(u=>u.id===id));},
  wear(id){pickSkin(SKINS.find(x=>x.id===id));},get save(){return save;},
  own(id){unlockSkin(id);},ownAll(){for(const sk of SKINS)unlockSkin(sk.id);},page(n){castlePage=n;},addChests(n){save.chests+=n;persist();},openChest(){openChest();},
  lineup(ids,cols,sc,flying){lineupSpec=ids?{ids,cols,sc,flying}:null;},
  boss(){gen.nextBoss=gen.x;},wardrobe(){openWardrobe();},preview(id){setPreview(id);},stageAt(t){stageT=t;},flyPose(v){stageFly=!!v;},get bossInfo(){const b=ents.find(e=>e.type==='boss');return b?{state:b.state,hp:b.hp,sx:Math.round(b.sx),y:Math.round(b.y)}:null;},
  spawn(t,dx){spawnEnemy(t,cam+PX+(dx||W*0.8),0.6);},
  spawnFast(dx){addEnt({type:'farmer',wx:cam+PX+(dx||W*0.8),state:'idle',t:0,throws:1,ph:0,fast:true,aimY:0,locked:false});},
  get farmers(){return ents.filter(e=>e.type==='farmer').map(e=>({state:e.state,t:+e.t.toFixed(2),fast:e.fast}));},
  get forks(){return ents.filter(e=>e.type==='fork').map(e=>({fast:e.fast,sx:Math.round(e.wx-cam),y:Math.round(e.y)}));},
  setY(y){P.y=y;P.vy=0;},
  resetStats(){for(const k in stats)stats[k]=0;},
  entTypes(){const o={};for(const e of ents)o[e.type]=(o[e.type]||0)+1;return o;},
};
})();
</script>
